<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thermoptic Camouflage — YANGA</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0a0a0f;overflow:hidden;font-family:'Courier New',monospace;color:#c0c0c0}
  canvas{display:block;position:fixed;top:0;left:0;width:100vw;height:100vh;cursor:crosshair}

  .hud{position:fixed;z-index:10;pointer-events:none}
  .hud-top{top:20px;left:20px}
  .hud-top h1{font-size:11px;letter-spacing:4px;color:#00a8ff;text-transform:uppercase;opacity:.7}
  .hud-top p{font-size:9px;letter-spacing:2px;color:#555;margin-top:4px}
  .hud-bottom{bottom:20px;left:20px}
  .hud-bottom p{font-size:9px;letter-spacing:2px;color:#444}
  .hud-status{top:20px;right:20px;text-align:right}
  .hud-status .status-label{font-size:9px;letter-spacing:3px;color:#555}
  .hud-status .status-value{font-size:11px;letter-spacing:2px;margin-top:2px;transition:color .3s}
  .status-active{color:#00ff88}
  .status-inactive{color:#ff4444}

  .scan-line{
    position:fixed;top:0;left:0;width:100%;height:100%;
    z-index:5;pointer-events:none;
    background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,168,255,0.015) 2px,rgba(0,168,255,0.015) 4px);
  }
  .instructions{
    position:fixed;bottom:20px;right:20px;z-index:10;
    font-size:9px;letter-spacing:2px;color:#444;
    text-align:right;pointer-events:none;
  }
</style>
</head>
<body>

<div class="scan-line"></div>

<div class="hud hud-top">
  <h1>Thermoptic Camouflage System</h1>
  <p>Section 9 — Public Security</p>
</div>

<div class="hud hud-status">
  <div class="status-label">CLOAK STATUS</div>
  <div class="status-value status-inactive" id="statusText">INACTIVE</div>
</div>

<div class="hud hud-bottom">
  <p id="coords">X: 0000 Y: 0000</p>
</div>

<div class="instructions">
  CLICK TO ACTIVATE / DEACTIVATE<br>
  MOVE CURSOR TO TRACK TARGET
</div>

<canvas id="bg"></canvas>
<canvas id="fx" style="z-index:2"></canvas>

<script>
// ══════════════════════════════════════════════
// LAYER 1 — Procedural cyberpunk cityscape (2D)
// ══════════════════════════════════════════════
const bgCanvas = document.getElementById('bg');
const bgCtx = bgCanvas.getContext('2d');

let W, H;
let buildings = [];
let stars = [];

function resize() {
  W = bgCanvas.width = window.innerWidth;
  H = bgCanvas.height = window.innerHeight;
  fxCanvas.width = W;
  fxCanvas.height = H;
  generateCity();
  generateStars();
}

function generateStars() {
  stars = [];
  for (let i = 0; i < 120; i++) {
    stars.push({ x: Math.random()*W, y: Math.random()*H*0.4, s: Math.random()*1.5+0.3, p: Math.random()*6.28 });
  }
}

function randomAccent() {
  return ['#00a8ff','#00ff88','#ff6644','#ffaa00','#ff44aa','#44ffff'][Math.floor(Math.random()*6)];
}

function generateCity() {
  buildings = [];
  const hy = H * 0.55;
  // 3 layers
  [[15,12,25,0.25,40, 0],[30,20,40,0.35,80, 1],[50,30,60,0.45,120, 2]].forEach(([gapMin,wMin,wMax,hPct,hOff,layer]) => {
    for (let x = -20; x < W; x += Math.random()*gapMin + gapMin) {
      const bw = Math.random()*wMax + wMin;
      const bh = Math.random()*H*hPct + hOff;
      const br = 4 + layer*4;
      buildings.push({
        x, y: hy-bh, w: bw, h: bh, layer,
        r: br+Math.random()*4, g: br+Math.random()*4, b: br+6+Math.random()*6,
        litColor: randomAccent(), seed: x*13.7
      });
    }
  });
  buildings.sort((a,b) => a.layer - b.layer);
}

function drawCity(t) {
  // Sky
  const sky = bgCtx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#050510'); sky.addColorStop(0.4,'#0a0a1a');
  sky.addColorStop(0.55,'#0d1020'); sky.addColorStop(1,'#0a0a0f');
  bgCtx.fillStyle = sky;
  bgCtx.fillRect(0,0,W,H);

  // Stars
  for (const s of stars) {
    bgCtx.fillStyle = `rgba(200,220,255,${0.3+0.4*Math.sin(t*0.001+s.p)})`;
    bgCtx.beginPath(); bgCtx.arc(s.x,s.y,s.s,0,6.28); bgCtx.fill();
  }

  // Horizon glow
  const glow = bgCtx.createRadialGradient(W*.5,H*.55,0,W*.5,H*.55,W*.5);
  glow.addColorStop(0,'rgba(0,168,255,0.06)'); glow.addColorStop(1,'transparent');
  bgCtx.fillStyle = glow;
  bgCtx.fillRect(0,0,W,H);

  // Buildings
  for (const b of buildings) {
    bgCtx.fillStyle = `rgb(${b.r},${b.g},${b.b})`;
    bgCtx.fillRect(b.x, b.y, b.w, b.h);

    // Antenna
    if (b.h > 200 && b.layer >= 1) {
      bgCtx.strokeStyle = 'rgba(100,100,120,0.3)'; bgCtx.lineWidth = 1;
      bgCtx.beginPath(); bgCtx.moveTo(b.x+b.w*.5,b.y); bgCtx.lineTo(b.x+b.w*.5,b.y-20); bgCtx.stroke();
      if (Math.sin(t*0.002+b.x) > 0.7) {
        bgCtx.fillStyle='rgba(255,0,0,0.8)'; bgCtx.beginPath();
        bgCtx.arc(b.x+b.w*.5,b.y-20,1.5,0,6.28); bgCtx.fill();
      }
    }

    // Windows
    const ws = b.layer===0?2:b.layer===1?3:4;
    const gap = ws*2.5;
    for (let wy=b.y+gap; wy<b.y+b.h-gap; wy+=gap) {
      for (let wx=b.x+gap; wx<b.x+b.w-gap; wx+=gap) {
        const isLit = Math.sin(wx*13.7+wy*7.3+b.seed) > 0.6;
        if (isLit) {
          const fl = Math.sin(t*0.003+wx+wy) > 0.95 ? 0.3 : 1;
          bgCtx.fillStyle = b.litColor;
          bgCtx.globalAlpha = (b.layer===0?0.15:b.layer===1?0.25:0.4)*fl;
        } else {
          bgCtx.fillStyle = `rgb(${b.r-2},${b.g-2},${b.b+4})`;
          bgCtx.globalAlpha = 0.4;
        }
        bgCtx.fillRect(wx,wy,ws,ws);
      }
    }
    bgCtx.globalAlpha = 1;
  }

  // Ground
  const hy = H*0.55;
  bgCtx.fillStyle='#06060c'; bgCtx.fillRect(0,hy,W,H-hy);
  bgCtx.strokeStyle='rgba(0,168,255,0.04)'; bgCtx.lineWidth=1;
  for (let i=0;i<30;i++){const y=hy+(i/30)*(H-hy); bgCtx.beginPath();bgCtx.moveTo(0,y);bgCtx.lineTo(W,y);bgCtx.stroke();}
}

// ══════════════════════════════════════════════
// LAYER 2 — Figure + cloak effect (2D overlay)
// ══════════════════════════════════════════════
const fxCanvas = document.getElementById('fx');
const fxCtx = fxCanvas.getContext('2d');

let mouse = {x:0, y:0};
let cloakActive = false;
let cloakT = 0;
const statusEl = document.getElementById('statusText');
const coordsEl = document.getElementById('coords');

function figurePath(ctx, cx, cy, sc) {
  ctx.beginPath();
  const p = (x,y) => [cx+x*sc, cy+y*sc];
  // Head
  ctx.arc(...p(0,-85), 14*sc, 0, 6.28);
  // Body
  ctx.moveTo(...p(-10,-71));
  ctx.lineTo(...p(-6,-65)); ctx.lineTo(...p(-22,-58)); ctx.lineTo(...p(-26,-20));
  ctx.lineTo(...p(-18,-18)); ctx.lineTo(...p(-16,-50)); ctx.lineTo(...p(-14,-10));
  ctx.lineTo(...p(-18,50)); ctx.lineTo(...p(-20,85)); ctx.lineTo(...p(-10,88));
  ctx.lineTo(...p(-8,52)); ctx.lineTo(...p(0,5));
  ctx.lineTo(...p(8,52)); ctx.lineTo(...p(10,88)); ctx.lineTo(...p(20,85));
  ctx.lineTo(...p(18,50)); ctx.lineTo(...p(14,-10));
  ctx.lineTo(...p(16,-50)); ctx.lineTo(...p(18,-18)); ctx.lineTo(...p(26,-20));
  ctx.lineTo(...p(22,-58)); ctx.lineTo(...p(6,-65)); ctx.lineTo(...p(10,-71));
  ctx.closePath();
}

function drawFigureAndCloak(time) {
  fxCtx.clearRect(0,0,W,H);

  const figX = W*0.5;
  const figY = H*0.48;
  const scale = Math.min(W,H)/400;

  // ── Solid figure when not cloaked ──
  const solidAlpha = 1 - cloakT;
  if (solidAlpha > 0.01) {
    fxCtx.save();
    figurePath(fxCtx, figX, figY, scale);
    fxCtx.fillStyle = `rgba(12,12,22,${solidAlpha})`;
    fxCtx.fill();
    fxCtx.strokeStyle = `rgba(0,168,255,${0.3*solidAlpha})`;
    fxCtx.lineWidth = 1.5;
    fxCtx.stroke();
    fxCtx.restore();
  }

  // ── Cloak distortion effect ──
  if (cloakT > 0.01) {
    // Sample the background canvas and draw a distorted version clipped to figure
    const bx = Math.floor(figX - 35*scale);
    const by = Math.floor(figY - 105*scale);
    const bw = Math.ceil(70*scale);
    const bh = Math.ceil(200*scale);

    // Clamp bounds
    const sx = Math.max(0, bx);
    const sy = Math.max(0, by);
    const sw = Math.min(bw, W - sx);
    const sh = Math.min(bh, H - sy);

    if (sw > 0 && sh > 0) {
      fxCtx.save();
      figurePath(fxCtx, figX, figY, scale);
      fxCtx.clip();

      // Draw background shifted/distorted — simple displacement via slicing
      const sliceH = 3;
      for (let row = 0; row < sh; row += sliceH) {
        const worldY = sy + row;
        const disp = Math.sin(worldY * 0.06 + time * 0.004) * 8 * cloakT
                   + Math.sin(worldY * 0.15 + time * 0.009) * 4 * cloakT;
        const chromaOff = cloakT * 3;

        // Red-shifted slice
        fxCtx.globalAlpha = cloakT * 0.35;
        fxCtx.drawImage(bgCanvas, sx, worldY, sw, sliceH,
                        sx + disp + chromaOff, worldY, sw, sliceH);
        // Green base slice
        fxCtx.globalAlpha = cloakT * 0.5;
        fxCtx.drawImage(bgCanvas, sx, worldY, sw, sliceH,
                        sx + disp, worldY, sw, sliceH);
        // Blue-shifted slice
        fxCtx.globalAlpha = cloakT * 0.35;
        fxCtx.drawImage(bgCanvas, sx, worldY, sw, sliceH,
                        sx + disp - chromaOff, worldY, sw, sliceH);
      }
      fxCtx.globalAlpha = 1;

      // Horizontal interference lines
      fxCtx.strokeStyle = `rgba(0,168,255,${0.07*cloakT})`;
      fxCtx.lineWidth = 0.5;
      for (let i = 0; i < 15 * cloakT; i++) {
        const ly = sy + Math.random() * sh;
        const w2 = Math.sin(ly*0.1+time*0.01)*10*cloakT;
        fxCtx.beginPath(); fxCtx.moveTo(sx+w2,ly); fxCtx.lineTo(sx+sw+w2,ly); fxCtx.stroke();
      }

      // Glitch blocks
      for (let i = 0; i < 5 * cloakT; i++) {
        const gy = sy + Math.random()*sh;
        const gw = Math.random()*30*cloakT+5;
        const gx = figX - gw/2 + (Math.random()-0.5)*20;
        fxCtx.fillStyle = `rgba(0,168,255,${Math.random()*0.05*cloakT})`;
        fxCtx.fillRect(gx,gy,gw,1);
      }

      fxCtx.restore();
    }

    // Edge shimmer
    fxCtx.save();
    figurePath(fxCtx, figX, figY, scale);
    const ea = 0.15 + 0.1*Math.sin(time*0.005);
    fxCtx.strokeStyle = `rgba(0,168,255,${ea*(1-cloakT*0.7)})`;
    fxCtx.lineWidth = 2 + cloakT*2;
    fxCtx.stroke();

    if (cloakT > 0.3) {
      figurePath(fxCtx, figX, figY, scale*(1+0.01*Math.sin(time*0.008)));
      fxCtx.strokeStyle = `rgba(0,255,136,${0.06*cloakT})`;
      fxCtx.lineWidth = 1;
      fxCtx.stroke();
    }
    fxCtx.restore();
  }

  // ── Reticle ──
  fxCtx.save();
  fxCtx.strokeStyle = 'rgba(0,168,255,0.25)';
  fxCtx.lineWidth = 0.5;
  const mx = mouse.x, my = mouse.y;
  fxCtx.beginPath();
  fxCtx.moveTo(mx-20,my); fxCtx.lineTo(mx-6,my);
  fxCtx.moveTo(mx+6,my); fxCtx.lineTo(mx+20,my);
  fxCtx.moveTo(mx,my-20); fxCtx.lineTo(mx,my-6);
  fxCtx.moveTo(mx,my+6); fxCtx.lineTo(mx,my+20);
  fxCtx.stroke();
  fxCtx.beginPath();
  const a = time*0.001;
  fxCtx.arc(mx,my,15,a,a+Math.PI*1.5);
  fxCtx.stroke();
  fxCtx.restore();
}

// ══════════════════════════════════════════════
// ANIMATION LOOP
// ══════════════════════════════════════════════
let lastTime = 0;

function animate(time) {
  const dt = Math.min((time-lastTime)/1000, 0.05);
  lastTime = time;

  // Smooth transition
  const target = cloakActive ? 1 : 0;
  const speed = cloakActive ? 1.8 : 2.5;
  cloakT += (target - cloakT) * speed * dt;
  if (Math.abs(cloakT-target) < 0.001) cloakT = target;

  drawCity(time);
  drawFigureAndCloak(time);

  requestAnimationFrame(animate);
}

// ══════════════════════════════════════════════
// EVENTS
// ══════════════════════════════════════════════
window.addEventListener('resize', resize);

fxCanvas.addEventListener('mousemove', e => {
  mouse.x = e.clientX; mouse.y = e.clientY;
  coordsEl.textContent = `X: ${String(e.clientX).padStart(4,'0')} Y: ${String(e.clientY).padStart(4,'0')}`;
});

fxCanvas.addEventListener('click', () => {
  cloakActive = !cloakActive;
  statusEl.textContent = cloakActive ? 'ACTIVE' : 'INACTIVE';
  statusEl.className = 'status-value ' + (cloakActive ? 'status-active' : 'status-inactive');
});

fxCanvas.addEventListener('touchstart', e => {
  e.preventDefault();
  mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY;
  cloakActive = !cloakActive;
  statusEl.textContent = cloakActive ? 'ACTIVE' : 'INACTIVE';
  statusEl.className = 'status-value ' + (cloakActive ? 'status-active' : 'status-inactive');
});

fxCanvas.addEventListener('touchmove', e => {
  e.preventDefault();
  mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY;
});

resize();
requestAnimationFrame(animate);
</script>
</body>
</html>
