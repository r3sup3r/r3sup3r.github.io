<section class="project-hero">
  <h1>ARTICLES</h1>
  <div class="breadcrumb-path"><a href="{{root}}index.html">yanga</a><span class="sep">/</span><span class="current">blog</span></div>
  <p class="project-tagline">All research articles — penetration testing and AI security.</p>
  <div class="accent-bar green"></div>
</section>

<div class="filter-bar">
  <button class="filter-btn active" data-filter="all">All</button>
  <button class="filter-btn" data-filter="pentesting">Pentesting</button>
  <button class="filter-btn" data-filter="ai-security">AI Security</button>
</div>

<div class="blog-timeline">
  <div class="tl-empty" style="padding:48px 0;text-align:center;opacity:0.65;font-family:'Share Tech Mono',monospace;">
    <div style="font-size:14px;letter-spacing:2px;">// no articles yet</div>
    <div style="font-size:12px;margin-top:8px;opacity:0.7;">archive is empty &mdash; check back soon</div>
  </div>
</div>

<script>
function filterPosts(category) {
  document.querySelectorAll('.filter-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.filter === category);
  });
  document.querySelectorAll('.tl-item').forEach(item => {
    item.style.display = (category === 'all' || item.dataset.category === category) ? '' : 'none';
  });
}

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => filterPosts(btn.dataset.filter));
});
</script>
