<section class="project-hero">
  <h1>ARTICLES</h1>
  <div class="breadcrumb-path"><a href="{{root}}index.html">yanga</a><span class="sep">/</span><span class="current">blog</span></div>
  <p class="project-tagline">All research articles: penetration testing, AI security, and concept clarifications.</p>
  <div class="accent-bar green"></div>
</section>

<div class="blog-timeline">
{{#posts}}
  <div class="tl-item">
    <div class="tl-date">{{dateLabel}}</div>
    <a class="tl-card" href="{{root}}posts/{{slug}}">
      <h4><i class="fa-solid {{icon}}"></i>{{title}}</h4>
      <p>{{excerpt}}</p>
      <div class="tl-meta"><span class="tl-read">{{read}}</span></div>
    </a>
  </div>
{{/posts}}
{{#noPosts}}
  <div class="empty-state">
    <span class="empty-state-tag">// no entries yet</span>
    <p>First write-ups are in progress. New work lands here as it ships.</p>
  </div>
{{/noPosts}}
</div>
