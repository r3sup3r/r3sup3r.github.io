  "title": "404",
  "description": "Page not found",
  "layout": "base",
  "activeNav": ""
}

<style>
  .error-page {
    position: relative;
    min-height: calc(100vh - 60px);
    overflow: hidden;
    animation: errorFadeIn 0.6s ease forwards;
  }
  @keyframes errorFadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Canvas — background, behind content */
  .ascii-canvas-wrap {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none; user-select: none;
    z-index: 0;
  }
  #asciiCanvas {
    display: block;
  }

  .error-container {
    position: relative; z-index: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: calc(100vh - 60px); text-align: center; padding: 40px 20px;
  }
  .error-code {
    font-family: 'Orbitron', sans-serif; font-size: 7rem; font-weight: 900;
    color: var(--text-bright); letter-spacing: 10px; line-height: 1;
    text-shadow: 0 0 60px rgba(var(--accent-rgb),0.2), 0 0 120px rgba(var(--accent-rgb),0.08);
    position: relative;
    animation: glitch-skew 4s infinite linear alternate-reverse;
  }
  .error-code::before,
  .error-code::after {
    content: '404';
    position: absolute; top: 0; left: 0; right: 0;
    overflow: hidden;
  }
  .error-code::before {
    color: var(--text-bright);
    text-shadow: -2px 0 rgba(var(--accent-rgb),0.7);
    animation: glitch-top 3s infinite linear alternate-reverse;
    clip-path: inset(0 0 65% 0);
  }
  .error-code::after {
    color: var(--text-bright);
    text-shadow: 2px 0 rgba(255,60,60,0.5), -1px 0 rgba(var(--accent-rgb),0.5);
    animation: glitch-bottom 2.5s infinite linear alternate-reverse;
    clip-path: inset(65% 0 0 0);
  }
  @keyframes glitch-top {
    0%, 92% { transform: translate(0); }
    93% { transform: translate(-3px, -1px); }
    94% { transform: translate(2px, 1px); }
    95% { transform: translate(-1px, -2px); }
    96%, 100% { transform: translate(0); }
  }
  @keyframes glitch-bottom {
    0%, 90% { transform: translate(0); }
    91% { transform: translate(3px, 1px); }
    92% { transform: translate(-2px, -1px); }
    93% { transform: translate(1px, 2px); }
    94% { transform: translate(-3px, 0); }
    95%, 100% { transform: translate(0); }
  }
  @keyframes glitch-skew {
    0%, 95% { transform: skew(0deg); }
    96% { transform: skew(-0.5deg); }
    97% { transform: skew(0.3deg); }
    98% { transform: skew(-0.2deg); }
    99%, 100% { transform: skew(0deg); }
  }
  .error-label {
    font-family: 'Orbitron', sans-serif; font-size: 0.9rem;
    color: var(--accent); letter-spacing: 4px; margin: 15px 0 30px;
    text-transform: uppercase; font-weight: 700;
    text-shadow: 0 0 10px rgba(var(--accent-rgb),0.5), 0 0 20px rgba(var(--accent-rgb),0.3);
  }
  .error-message {
    color: var(--text-primary); font-size: 1rem; line-height: 1.8;
    max-width: 480px; margin-bottom: 40px;
    letter-spacing: 0.3px;
  }
  .error-links { display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; }
  .error-links a {
    padding: 10px 24px; font-size: 0.7rem; letter-spacing: 2px;
    text-transform: uppercase; border: 1px solid rgba(var(--accent-rgb),0.7);
    border-radius: 3px; color: var(--accent); transition: all 0.3s;
    background: rgba(var(--accent-rgb),0.15); font-weight: 700;
    text-shadow: 0 0 8px rgba(var(--accent-rgb),0.3);
    box-shadow: 0 0 6px rgba(var(--accent-rgb),0.15);
  }
  .error-links a:hover {
    color: var(--accent); border-color: rgba(var(--accent-rgb),0.9);
    background: rgba(var(--accent-rgb),0.22); box-shadow: 0 0 20px rgba(var(--accent-rgb),0.25);
  }
  @media (max-width: 768px) {
    .error-code { font-size: 5rem; }
  }
  @media (max-width: 480px) {
    .error-code { font-size: 3.5rem; letter-spacing: 5px; }
  }
  /* ── GHOST speech bubble (404) ── */
  .g404-stage{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:20px;margin:6px 0 36px;}
  .g404-ghost{width:118px;height:118px;position:relative;cursor:pointer;filter:drop-shadow(0 6px 22px rgba(var(--accent-rgb),.28));}
  .g404-bubble{position:relative;max-width:340px;background:rgba(11,14,20,.97);border:1px solid rgba(var(--accent-rgb),.55);border-radius:14px;padding:14px 18px;line-height:1.5;box-shadow:0 10px 30px rgba(0,0,0,.4),0 0 18px rgba(var(--accent-rgb),.38),0 0 40px rgba(var(--accent-rgb),.2);opacity:0;clip-path:inset(50% 0 50% 0 round 3px);transform-origin:center;}
  .g404-bubble::after{content:"";position:absolute;bottom:-8px;left:50%;margin-left:-7px;width:14px;height:14px;background:rgba(11,14,20,.97);border-right:1px solid rgba(var(--accent-rgb),.55);border-bottom:1px solid rgba(var(--accent-rgb),.55);transform:rotate(45deg);border-bottom-right-radius:2px;}
  .g404-q{display:block;color:var(--text-bright);font-family:var(--font-prose,'Inter',sans-serif);font-size:.84rem;line-height:1.6;letter-spacing:.2px;text-shadow:0 1px 4px rgba(0,0,0,.75),0 0 10px rgba(0,0,0,.5);}
  .g404-scan{position:absolute;left:0;right:0;top:50%;height:2px;transform:translateY(-50%);z-index:6;pointer-events:none;opacity:0;background:linear-gradient(90deg,transparent,rgba(var(--accent-rgb),1) 18%,#eaf6ff,rgba(var(--accent-rgb),1) 82%,transparent);box-shadow:0 0 18px 2px rgba(var(--accent-rgb),.9);}
  .g404-bubble.show{opacity:1;clip-path:inset(-44px -44px -44px -44px round 16px);animation:g4-crt .62s cubic-bezier(.2,.8,.25,1);}
  .g404-bubble.show .g404-scan{animation:g4-line .62s ease-out;}
  .g404-bubble.show .g404-q{animation:g4-qin .62s both;}
  [data-mode="light"] .g404-q{color:#12233d;text-shadow:0 1px 3px rgba(255,255,255,.85),0 0 8px rgba(255,255,255,.6);}
  [data-mode="light"] .g404-bubble{background:rgba(244,247,251,.98);box-shadow:0 10px 30px rgba(60,80,120,.16),0 0 18px rgba(var(--accent-rgb),.3),0 0 40px rgba(var(--accent-rgb),.16);}
  [data-mode="light"] .g404-bubble::after{background:rgba(244,247,251,.98);}
  @keyframes g4-crt{
    0%{clip-path:inset(calc(50% - 1.5px) -44px calc(50% - 1.5px) -44px round 2px);transform:scaleX(.4);}
    10%{clip-path:inset(calc(50% - 1.5px) -44px calc(50% - 1.5px) -44px round 2px);transform:scaleX(1);}
    44%{clip-path:inset(calc(50% - 1.5px) -44px calc(50% - 1.5px) -44px round 2px);transform:scaleX(1);}
    68%{clip-path:inset(-44px -44px -44px -44px round 16px);transform:scale(1.03,.97);}
    80%{clip-path:inset(-44px -44px -44px -44px round 16px);transform:scale(.988,1.016);}
    90%{clip-path:inset(-44px -44px -44px -44px round 16px);transform:scale(1.008,.996);}
    97%{clip-path:inset(-44px -44px -44px -44px round 16px);transform:scale(.998,1.003);}
    100%{clip-path:inset(-44px -44px -44px -44px round 16px);transform:none;}
  }
  @keyframes g4-line{0%{opacity:0;}14%{opacity:1;}38%{opacity:1;}46%{opacity:0;}100%{opacity:0;}}
  @keyframes g4-qin{0%{opacity:0;}62%{opacity:0;}82%{opacity:1;}100%{opacity:1;}}
  /* relocate the real GHOST widget into the 404 stage (all its effects come with it) */
  body.is-404 #tk-fab{position:relative;left:auto;right:auto;top:auto;bottom:auto;width:120px;height:120px;}
  body.is-404 #tk-bubble{display:none!important;}          /* hide widget teaser; the 404 bubble speaks instead */
  body.is-404.tk-open .g404-bubble{opacity:0!important;pointer-events:none;transition:opacity .2s;}
</style>

<div class="error-page">

  <div class="ascii-canvas-wrap" id="asciiWrap">
    <canvas id="asciiCanvas"></canvas>
  </div>

  <div class="error-container">
    <div class="error-code">404</div>
    <div class="error-label" id="glitch-label">GHOST NOT FOUND</div>
    <div class="g404-stage">
      <div id="g404-bubble" class="g404-bubble">
        <span class="g404-scan" aria-hidden="true"></span>
        <span class="g404-q">The ghost you're looking for is in another shell.</span>
      </div>
      <div class="g404-ghost" id="g404-slot" style="display:flex;align-items:center;justify-content:center;"></div>
    </div>
    <div class="error-links">
      <a href="{{root}}index.html">Home</a>
      <a href="{{root}}blog.html">Blog</a>
    </div>
  </div>

</div>

      for (var i = 0; i < len; i++) {
        if (!locked[i] && chars[i] !== ' ') scr[i] = dRand();
      }
      el.textContent = scr.join('');
    }, 60);
    var lck = setInterval(function() {
      while (lockIdx < len && chars[lockIdx] === ' ') { locked[lockIdx] = true; lockIdx++; }
      if (lockIdx < len) { scr[lockIdx] = chars[lockIdx]; locked[lockIdx] = true; lockIdx++; el.textContent = scr.join(''); }
      if (lockIdx >= len) { clearInterval(lck); clearInterval(cyc); el.textContent = text; }
    }, 80);
  }
  // decode animation is now triggered by the ASCII art fadeout completion
})();
</script>

<script>
// === 404 MINI TERMINAL ===
(function() {
  var input = document.querySelector('.term-input');
  var output = document.querySelector('.term-output');
  var terminal = document.querySelector('.mini-terminal');
  if (!input || !output) return;
  if (terminal) terminal.addEventListener('click', function() { input.focus(); });

  var root = '{{root}}';
  function acc(t) { return '<span style="color:var(--accent);">' + t + '</span>'; }


  var commands = {
    ls: 'pentesting/  ai-red-team/  blog/  tools/  about.txt  skills.txt',
    whoami: 'YANGA — pentester pivoting to AI security. Breaking systems to make them stronger.',
    'cat /etc/shadow': acc('Permission denied.') + ' But nice instinct.',
    'sudo rm -rf /': acc('nice try.') + ' Even the 404 page is protected.',
    'rm -rf /': acc('Permission denied.') + ' Try with ' + acc('sudo') + ' if you dare.',
    matrix: acc('You take the red pill, you stay in Wonderland...'),
    sudo: acc('sudo:') + ' specify a command. (Hint: you\'re already root.)',
    sl: '      ====        ________\n  _D _|  |_______/        \\__I_\n   |(_)---  |   H\\________/ |  |\n   /     |  |   H  |  |     |  |\n  |      |  |   H  |__|     |  |\n  |_____||__|___H__|__|_____|__|\n    O    O      O  / /     O   O\n   _______________/ /____________\n  |_______________|/____________|'
  };

  var cmdHistory = [];
  var historyIndex = -1;

  input.addEventListener('keydown', function(e) {
    if (e.key === 'ArrowUp') {
      e.preventDefault();
      if (cmdHistory.length === 0) return;
      if (historyIndex < cmdHistory.length - 1) historyIndex++;
      input.value = cmdHistory[cmdHistory.length - 1 - historyIndex];
      return;
    }
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      if (historyIndex > 0) { historyIndex--; input.value = cmdHistory[cmdHistory.length - 1 - historyIndex]; }
      else { historyIndex = -1; input.value = ''; }
      return;
    }
    if (e.key !== 'Enter') return;
    var rawCmd = input.value.trim();
    var cmd = rawCmd.toLowerCase();
    input.value = '';
    if (!cmd) return;
    cmdHistory.push(rawCmd);
    if (cmdHistory.length > 5) cmdHistory.shift();
    historyIndex = -1;

    if (cmd === 'clear') { output.innerHTML = ''; return; }

    // Navigation
    if (cmd === 'home' || cmd === 'cd ~' || cmd === 'cd') { window.location.href = root + 'index.html'; return; }
    if (cmd === 'ai') { window.location.href = root + 'sections/ai-red-teaming.html'; return; }
    if (cmd === 'pentest' || cmd === 'pentesting') { window.location.href = root + 'sections/pentesting.html'; return; }
    if (cmd === 'blog') { window.location.href = root + 'blog.html'; return; }
    if (cmd === 'tools') { window.location.href = root + 'tools.html'; return; }
    if (cmd === 'about') { window.location.href = root + 'about.html'; return; }

    if (cmd === 'help' || cmd === '--help' || cmd === '-h') {
      output.innerHTML = '<pre style="margin:0;font-size:11px;line-height:1.5;">'
        + acc('YANGA Terminal') + ' — ' + acc('404 RECOVERY MODE') + '\n\n'
        + acc('Navigation:') + '\n'
        + '  home                    Return to HQ\n'
        + '  ai                      Go to AI Security\n'
        + '  pentest                 Go to Pentesting\n'
        + '  blog                    Go to Blog\n'
        + '  tools                   Go to Tools\n'
        + '  about                   Go to About\n'
        + '\n'
        + acc('System:') + '\n'
        + '  clear                   Clear terminal output\n'
        + '</pre>';
      return;
    }

    if (commands[cmd]) {
      var val = typeof commands[cmd] === 'function' ? commands[cmd]() : commands[cmd];
      output.innerHTML = val.replace(/\n/g, '<br>');
    } else {
      output.innerHTML = acc('Command not found:') + ' ' + cmd + '. Type ' + acc('help') + ' to find your way back.';
    }
  });

  // Click outside to unfocus
  document.addEventListener('click', function(e) {
    if (!terminal.contains(e.target)) { input.blur(); output.innerHTML = ''; }
  });
})();
</script>

<script>
(function(){
  var bubble=document.getElementById('g404-bubble');
  var slot=document.getElementById('g404-slot');
  if(!bubble||!slot) return;
  document.body.classList.add('is-404');
  function pop(){ bubble.classList.remove('show'); void bubble.offsetWidth; bubble.classList.add('show'); }
  // wait for the GHOST widget to build its fab, then move it into the 404 stage
  var tries=0;
  var iv=setInterval(function(){
    var fab=document.getElementById('tk-fab');
    tries++;
    if(fab){ clearInterval(iv); slot.appendChild(fab); guardReturn(fab); setTimeout(pop, 260); }
    else if(tries>60){ clearInterval(iv); setTimeout(pop,260); }
  }, 50);

  // The site navigates via PJAX, which removes this page's content on the way out.
  // The ghost lives here only for the 404 — send it back to <body> before it's torn out,
  // so it reappears in its normal corner on the next page (no refresh needed).
  function guardReturn(fab){
    var overlay=document.querySelector('.overlay');
    if(!overlay) return;
    var stage=document.getElementById('g404-slot');
    var mo=new MutationObserver(function(muts){
      for(var i=0;i<muts.length;i++){
        var rm=muts[i].removedNodes;
        for(var j=0;j<rm.length;j++){
          var n=rm[j];
          if(n.nodeType===1 && (n===fab || n.contains(fab) || (stage && n.contains(stage)))){
            document.body.appendChild(fab);          // detach from the removed subtree, put it home
            document.body.classList.remove('is-404');
            mo.disconnect();
            return;
          }
        }
      }
    });
    mo.observe(overlay,{childList:true});
    // safety net: also on popstate (back/forward) return the ghost if still parked in the stage
    window.addEventListener('popstate', function(){
      if(document.body.contains(fab) && fab.closest && fab.closest('#g404-slot')){
        document.body.appendChild(fab); document.body.classList.remove('is-404');
      }
    });
  }
})();
</script>
